e":17},"start":{"column":3,"line":17}}},{"id":"2041","mutatorName":"StringLiteral","replacement":"\"\"","status":"Survived","static":true,"testsCompleted":10,"coveredBy":[],"location":{"end":{"column":23,"line":17},"start":{"column":17,"line":17}}},{"id":"2075","mutatorName":"ArrowFunction","replacement":"() => undefined","status":"Survived","static":true,"testsCompleted":10,"coveredBy":[],"location":{"end":{"column":5,"line":112},"start":{"column":15,"line":65}}}],"source":"import { signalStore, withState, withComputed, withMethods, patchState } from '@ngrx/signals';\r\nimport { Product } from '@org/models';\r\n\r\nexport interface WishlistCompareState {\r\n  wishlist: Product[];\r\n  compareList: Product[];\r\n  maxCompareLimit: number;\r\n}\r\n\r\nconst initialState: WishlistCompareState = {\r\n  wishlist: [],\r\n  compareList: [],\r\n  maxCompareLimit: 4,\r\n};\r\n\r\nexport const WishlistCompareStore = signalStore(\r\n  { providedIn: 'root' },\r\n  withState(initialState),\r\n  withComputed((store) => {\r\n    const wishlistCount = () => store.wishlist().length;\r\n    const compareCount = () => store.compareList().length;\r\n\r\n    const canAddToCompare = () =>\r\n      store.compareList().length <"+" store.maxCompareLimit();\r\n\r\n    const wishlistTotalValue = () =>\r\n      store.wishlist().reduce((sum, p) => sum + p.price, 0);\r\n\r\n    const comparisonMatrix = () => {\r\n      const list = store.compareList();\r\n      if (list.length === 0) {\r\n        return {\r\n          cheapestProduct: null,\r\n          highestRatedProduct: null,\r\n          inStockCount: 0,\r\n          categories: [],\r\n        };\r\n      }\r\n\r\n      const cheapestProduct = list.reduce((prev, curr) =>\r\n        curr.price <"+" prev.price ? curr : prev\r\n      );\r\n      const highestRatedProduct = list.reduce((prev, curr) =>\r\n        curr.rating > prev.rating ? curr : prev\r\n      );\r\n      const inStockCount = list.filter((p) => p.inStock).length;\r\n      const categories = Array.from(new Set(list.map((p) => p.category)));\r\n\r\n      return {\r\n        cheapestProduct,\r\n        highestRatedProduct,\r\n        inStockCount,\r\n        categories,\r\n      };\r\n    };\r\n\r\n    return {\r\n      wishlistCount,\r\n      compareCount,\r\n      canAddToCompare,\r\n      wishlistTotalValue,\r\n      comparisonMatrix,\r\n    };\r\n  }),\r\n  withMethods((store) => ({\r\n    isWishlisted(productId: string): boolean {\r\n      return store.wishlist().some((p) => p.id === productId);\r\n    },\r\n\r\n    isCompared(productId: string): boolean {\r\n      return store.compareList().some((p) => p.id === productId);\r\n    },\r\n\r\n    toggleWishlist(product: Product) {\r\n      const exists = this.isWishlisted(product.id);\r\n      if (exists) {\r\n        patchState(store, {\r\n          wishlist: store.wishlist().filter((p) => p.id !== product.id),\r\n        });\r\n      } else {\r\n        patchState(store, { wishlist: [...store.wishlist(), product] });\r\n      }\r\n    },\r\n\r\n    addToCompare(product: Product): { success: boolean; message?: string } {\r\n      if (this.isCompared(product.id)) {\r\n        return { success: true };\r\n      }\r\n      if (store.compareList().length >= store.maxCompareLimit()) {\r\n        return {\r\n          success: false,\r\n          message: `Maximum ${store.maxCompareLimit()} items allowed in comparison`,\r\n        };\r\n      }\r\n      patchState(store, { compareList: [...store.compareList(), product] });\r\n      return { success: true };\r\n    },\r\n\r\n    removeFromCompare(productId: string) {\r\n      patchState(store, {\r\n        compareList: store.compareList().filter((p) => p.id !== productId),\r\n      });\r\n    },\r\n\r\n    clearCompare() {\r\n      patchState(store, { compareList: [] });\r\n    },\r\n\r\n    clearWishlist() {\r\n      patchState(store, { wishlist: [] });\r\n    },\r\n  }))\r\n);\r\n"}},"schemaVersion":"1.0","thresholds":{"high":80,"low":60,"break":null},"testFiles":{"packages/shop/cart/src/lib/store/cart.store.spec.ts":{"tests":[{"id":"0","name":"CartStore should initialize with default empty state"},{"id":"1","name":"CartStore should add items to cart and increment quantity if product already exists"},{"id":"2","name":"CartStore should treat different variants of the same product as separate items"},{"id":"3","name":"CartStore should remove items from cart"},{"id":"4","name":"CartStore should update quantity and remove item if set to 0 or negative"},{"id":"5","name":"CartStore should calculate rawSubtotal, netSubtotal, taxAmount (19%), shipping, and total"},{"id":"6","name":"CartStore should calculate shipping fee when subtotal is below free shipping threshold ($100)"},{"id":"7","name":"CartStore should apply PERCENTAGE coupon correctly (SAVE10 -> 10% off)"},{"id":"8","name":"CartStore should apply FIXED coupon correctly (SAVE20 -> $20 off)"},{"id":"9","name":"CartStore should apply FREESHIP coupon and make shipping $0 even below $100 threshold"},{"id":"10","name":"CartStore should reject invalid or inapplicable coupon codes"},{"id":"11","name":"CartStore should remove coupon when removeCoupon is called"},{"id":"12","name":"CartStore should convert convertedTotal according to selected currency rate"},{"id":"13","name":"CartStore should clear cart on clearCart()"}],"source":"import { TestBed } from '@angular/core/testing';\r\nimport { CartStore } from './cart.store';\r\nimport { Product } from '@org/models';\r\n\r\ndescribe('CartStore', () => {\r\n  let store: InstanceType<"+"typeof CartStore>;\r\n\r\n  const mockProductA: Product = {\r\n    id: 'p1',\r\n    name: 'Wireless Headphones',\r\n    description: 'High quality sound',\r\n    price: 120.0,\r\n    category: 'Electronics',\r\n    imageUrl: 'https://example.com/p1.jpg',\r\n    inStock: true,\r\n    rating: 4.8,\r\n    reviewCount: 150,\r\n  };\r\n\r\n  const mockProductB: Product = {\r\n    id: 'p2',\r\n    name: 'Mechanical Keyboard',\r\n    description: 'RGB switches',\r\n    price: 80.0,\r\n    category: 'Electronics',\r\n    imageUrl: 'https://example.com/p2.jpg',\r\n    inStock: true,\r\n    rating: 4.5,\r\n    reviewCount: 90,\r\n  };\r\n\r\n  beforeEach(() => {\r\n    TestBed.configureTestingModule({\r\n      providers: [CartStore],\r\n    });\r\n    store = TestBed.inject(CartStore);\r\n  });\r\n\r\n  it('should initialize with default empty state', () => {\r\n    expect(store.items()).toEqual([]);\r\n    expect(store.couponCode()).toBeNull();\r\n    expect(store.targetCurrency()).toBe('USD');\r\n    expect(store.itemCount()).toBe(0);\r\n    expect(store.isEmpty()).toBe(true);\r\n    expect(store.rawSubtotal()).toBe(0);\r\n  });\r\n\r\n  it('should add items to cart and increment quantity if product already exists', () => {\r\n    store.addItem(mockProductA, 1);\r\n    expect(store.items().length).toBe(1);\r\n    expect(store.items()[0].quantity).toBe(1);\r\n    expect(store.itemCount()).toBe(1);\r\n\r\n    store.addItem(mockProductA, 2);\r\n    expect(store.items().length).toBe(1);\r\n    expect(store.items()[0].quantity).toBe(3);\r\n    expect(store.itemCount()).toBe(3);\r\n  });\r\n\r\n  it('should treat different variants of the same product as separate items', () => {\r\n    const variantBlack = { id: 'v-black', name: 'Black' };\r\n    const variantWhite = { id: 'v-white', name: 'White', additionalPrice: 10 };\r\n\r\n    store.addItem(mockProductA, 1, variantBlack);\r\n    store.addItem(mockProductA, 1, variantWhite);\r\n\r\n    expect(store.items().length).toBe(2);\r\n    expect(store.rawSubtotal()).toBe(120 + 130);\r\n  });\r\n\r\n  it('should remove items from cart', () => {\r\n    store.addItem(mockProductA, 2);\r\n    store.addItem(mockProductB, 1);\r\n\r\n    store.removeItem('p1');\r\n    expect(store.items().length).toBe(1);\r\n    expect(store.items()[0].product.id).toBe('p2');\r\n  });\r\n\r\n  it('should update quantity and remove item if set to 0 or negative', () => {\r\n    store.addItem(mockProductA, 3);\r\n    store.updateQuantity('p1', 5);\r\n    expect(store.items()[0].quantity).toBe(5);\r\n\r\n    store.updateQuantity('p1', 0);\r\n    expect(store.items().length).toBe(0);\r\n  });\r\n\r\n  it('should calculate rawSubtotal, netSubtotal, taxAmount (19%), shipping, and total', () => {\r\n    // mockProductA = 120, mockProductB = 80\r\n    store.addItem(mockProductA, 1); // 120 -> netSubtotal >= $100 -> free shipping ($0)\r\n    expect(store.rawSubtotal()).toBe(120);\r\n    expect(store.shippingCost()).toBe(0);\r\n    expect(store.isEligibleForFreeShipping()).toBe(true);\r\n\r\n    const expectedTax = +(120 * 0.19).toFixed(2); // 22.8\r\n    expect(store.taxAmount()).toBe(expectedTax);\r\n    expect(store.total()).toBe(+(120 + expectedTax).toFixed(2));\r\n  });\r\n\r\n  it('should calculate shipping fee when subtotal is below free shipping threshold ($100)', () => {\r\n    store.addItem(mockProductB, 1); // 80 -> below $100\r\n    expect(store.shippingCost()).toBe(5.99);\r\n    expect(store.isEligibleForFreeShipping()).toBe(false);\r\n    expect(store.freeShippingRemaining()).toBe(20);\r\n  });\r\n\r\n  it('should apply PERCENTAGE coupon correctly (SAVE10 -> 10% off)', () => {\r\n    store.addItem(mockProductA, 1); // 120\r\n    const result = store.applyCoupon('SAVE10');\r\n\r\n    expect(result.success).toBe(true);\r\n    expect(store.discountAmount()).toBe(12);\r\n    expect(store.netSubtotal()).toBe(108);\r\n  });\r\n\r\n  it('should apply FIXED coupon correctly (SAVE20 -> $20 off)', () => {\r\n    store.addItem(mockProductA, 1); // 120\r\n    const result = store.applyCoupon('SAVE20');\r\n\r\n    expect(result.success).toBe(true);\r\n    expect(store.discountAmount()).toBe(20);\r\n    expect(store.netSubtotal()).toBe(100);\r\n  });\r\n\r\n  it('should apply FREESHIP coupon and make shipping $0 even below $100 threshold', () => {\r\n    store.addItem(mockProductB, 1); // $80\r\n    expect(store.shippingCost()).toBe(5.99);\r\n\r\n    const result = store.applyCoupon('FREESHIP');\r\n    expect(result.success).toBe(true);\r\n    expect(store.shippingCost()).toBe(0);\r\n  });\r\n\r\n  it('should reject invalid or inapplicable coupon codes', () => {\r\n    const result = store.applyCoupon('INVALID_CODE');\r\n    expect(result.success).toBe(false);\r\n    expect(store.couponCode()).toBeNull();\r\n  });\r\n\r\n  it('should remove coupon when removeCoupon is called', () => {\r\n    store.addItem(mockProductA, 1);\r\n    store.applyCoupon('SAVE10');\r\n    expect(store.couponCode()).toBe('SAVE10');\r\n\r\n    store.removeCoupon();\r\n    expect(store.couponCode()).toBeNull();\r\n    expect(store.discountAmount()).toBe(0);\r\n  });\r\n\r\n  it('should convert convertedTotal according to selected currency rate', () => {\r\n    store.addItem(mockProductA, 1); // 120 + 22.8 tax = 142.8 USD\r\n    store.setCurrency('EUR'); // 0.92 multiplier\r\n    const totalUSD = store.total();\r\n    const expectedEUR = +(totalUSD * 0.92).toFixed(2);\r\n    expect(store.convertedTotal()).toBe(expectedEUR);\r\n\r\n    store.setCurrency('GBP'); // 0.79 multiplier\r\n    const expectedGBP = +(totalUSD * 0.79).toFixed(2);\r\n    expect(store.convertedTotal()).toBe(expectedGBP);\r\n  });\r\n\r\n  it('should clear cart on clearCart()', () => {\r\n    store.addItem(mockProductA, 2);\r\n    store.applyCoupon('SAVE10');\r\n    store.clearCart();\r\n\r\n    expect(store.items().length).toBe(0);\r\n    expect(store.couponCode()).toBeNull();\r\n    expect(store.itemCount()).toBe(0);\r\n  });\r\n});\r\n"},"packages/shop/cart/src/lib/cart-widget/cart-widget.component.spec.ts":{"tests":[{"id":"14","name":"CartWidgetComponent should create cart widget component"},{"id":"15","name":"CartWidgetComponent should display empty cart message when no items"},{"id":"16","name":"CartWidgetComponent should render items and handle quantity increment and removal buttons"}],"source":"import { ComponentFixture, TestBed } from '@angular/core/testing';\r\nimport { CartWidgetComponent } from './cart-widget.component';\r\nimport { CartStore } from '../store/cart.store';\r\nimport { Product } from '@org/models';\r\n\r\ndescribe('CartWidgetComponent', () => {\r\n  let component: CartWidgetComponent;\r\n  let fixture: ComponentFixture<"+"CartWidgetComponent>;\r\n  let cartStore: InstanceType<"+"typeof CartStore>;\r\n\r\n  const mockProduct: Product = {\r\n    id: 'p1',\r\n    name: 'Test Headphones',\r\n    description: 'Test sound',\r\n    price: 100.0,\r\n    category: 'Electronics',\r\n    imageUrl: 'https://example.com/p1.jpg',\r\n    inStock: true,\r\n    rating: 4.5,\r\n    reviewCount: 10,\r\n  };\r\n\r\n  beforeEach(async () => {\r\n    await TestBed.configureTestingModule({\r\n      imports: [CartWidgetComponent],\r\n      providers: [CartStore],\r\n    }).compileComponents();\r\n\r\n    fixture = TestBed.createComponent(CartWidgetComponent);\r\n    component = fixture.componentInstance;\r\n    cartStore = TestBed.inject(CartStore);\r\n    fixture.detectChanges();\r\n  });\r\n\r\n  it('should create cart widget component', () => {\r\n    expect(component).toBeTruthy();\r\n  });\r\n\r\n  it('should display empty cart message when no items', () => {\r\n    const compiled = fixture.nativeElement as HTMLElement;\r\n    expect(compiled.textContent).toContain('Dein Warenkorb ist leer.');\r\n  });\r\n\r\n  it('should render items and handle quantity increment and removal buttons', () => {\r\n    cartStore.addItem(mockProduct, 2);\r\n    fixture.detectChanges();\r\n\r\n    const compiled = fixture.nativeElement as HTMLElement;\r\n    expect(compiled.textContent).toContain('Test Headphones');\r\n    expect(compiled.textContent).toContain('100 € x 2');\r\n\r\n    // Click increment (+)\r\n    let buttons = Array.from(compiled.querySelectorAll('button'));\r\n    const plusBtn = buttons.find(b => b.textContent?.trim() === '+');\r\n    plusBtn?.click();\r\n    fixture.detectChanges();\r\n    expect(cartStore.items()[0].quantity).toBe(3);\r\n\r\n    // Click decrement (-)\r\n    buttons = Array.from(compiled.querySelectorAll('button'));\r\n    const minusBtn = buttons.find(b => b.textContent?.trim() === '-');\r\n    minusBtn?.click();\r\n    fixture.detectChanges();\r\n    expect(cartStore.items()[0].quantity).toBe(2);\r\n\r\n    // Click remove (x)\r\n    buttons = Array.from(compiled.querySelectorAll('button'));\r\n    const removeBtn = buttons.find(b => b.textContent?.trim() === '×');\r\n    removeBtn?.click();\r\n    fixture.detectChanges();\r\n    expect(cartStore.isEmpty()).toBe(true);\r\n  });\r\n});\r\n"},"packages/shop/checkout/src/lib/store/checkout.store.spec.ts":{"tests":[{"id":"17","name":"CheckoutStore should initialize at step 1 (Customer Info)"},{"id":"18","name":"CheckoutStore should validate customer info fields"},{"id":"19","name":"CheckoutStore should validate shipping address fields including whitespace checks"},{"id":"20","name":"CheckoutStore should allow selecting shipping method"},{"id":"21","name":"CheckoutStore should validate payment details with Luhn algorithm for credit card, PayPal, and Invoice"},{"id":"22","name":"CheckoutStore should prevent advancing step if current step is invalid and allow step navigation"},{"id":"23","name":"CheckoutStore should calculate grand total for order summary"},{"id":"24","name":"CheckoutStore should handle order submission failure when data is incomplete"},{"id":"25","name":"CheckoutStore should submit order successfully and produce order confirmation"}],"source":"import { TestBed } from '@angular/core/testing';\r\nimport { CheckoutStore } from './checkout.store';\r\nimport { CustomerInfo, ShippingAddress, PaymentDetails, CartItem, Product } from '@org/models';\r\n\r\ndescribe('CheckoutStore', () => {\r\n  let store: InstanceType<"+"typeof CheckoutStore>;\r\n\r\n  const mockProduct: Product = {\r\n    id: 'p1',\r\n    name: 'Wireless Speaker',\r\n    description: 'Portable bluetooth speaker',\r\n    price: 100.0,\r\n    category: 'Audio',\r\n    imageUrl: 'https://example.com/speaker.jpg',\r\n    inStock: true,\r\n    rating: 4.7,\r\n    reviewCount: 45,\r\n  };\r\n\r\n  const mockCartItems: CartItem[] = [\r\n    {\r\n      product: mockProduct,\r\n      quantity: 2,\r\n      addedAt: new Date().toISOString(),\r\n    },\r\n  ];\r\n\r\n  beforeEach(() => {\r\n    TestBed.configureTestingModule({\r\n      providers: [CheckoutStore],\r\n    });\r\n    store = TestBed.inject(CheckoutStore);\r\n  });\r\n\r\n  it('should initialize at step 1 (Customer Info)', () => {\r\n    expect(store.currentStep()).toBe(1);\r\n    expect(store.isCustomerInfoValid()).toBe(false);\r\n    expect(store.isShippingAddressValid()).toBe(false);\r\n    expect(store.isPaymentInfoValid()).toBe(false);\r\n    expect(store.orderStatus()).toBe('IDLE');\r\n  });\r\n\r\n  it('should validate customer info fields', () => {\r\n    const invalidInfo: CustomerInfo = {\r\n      firstName: '',\r\n      lastName: 'Doe',\r\n      email: 'invalid-email',\r\n      phone: '123',\r\n    };\r\n    store.updateCustomerInfo(invalidInfo);\r\n    expect(store.isCustomerInfoValid()).toBe(false);\r\n\r\n    const validInfo: CustomerInfo = {\r\n      firstName: 'John',\r\n      lastName: 'Doe',\r\n      email: 'john.doe@example.com',\r\n      phone: '+1-555-0199',\r\n    };\r\n    store.updateCustomerInfo(validInfo);\r\n    expect(store.isCustomerInfoValid()).toBe(true);\r\n  });\r\n\r\n  it('should validate shipping address fields including whitespace checks', () => {\r\n    const invalidAddress: ShippingAddress = {\r\n      street: '   ',\r\n      city: 'Tech City',\r\n      state: 'CA',\r\n      zipCode: '90210',\r\n      country: 'USA',\r\n    };\r\n    store.updateShippingAddress(invalidAddress);\r\n    expect(store.isShippingAddressValid()).toBe(false);\r\n\r\n    const validAddress: ShippingAddress = {\r\n      street: '123 Main St',\r\n      city: 'Tech City',\r\n      state: 'CA',\r\n      zipCode: '90210',\r\n      country: 'USA',\r\n    };\r\n    store.updateShippingAddress(validAddress);\r\n    expect(store.isShippingAddressValid()).toBe(true);\r\n  });\r\n\r\n  it('should allow selecting shipping method', () => {\r\n    expect(store.selectedShippingMethod().id).toBe('standard');\r\n    expect(store.selectedShippingMethod().cost).toBe(4.99);\r\n\r\n    store.selectShippingMethod('express');\r\n    expect(store.selectedShippingMethod().id).toBe('express');\r\n    expect(store.selectedShippingMethod().cost).toBe(14.99);\r\n\r\n    store.selectShippingMethod('overnight');\r\n    expect(store.selectedShippingMethod().id).toBe('overnight');\r\n    expect(store.selectedShippingMethod().cost).toBe(29.99);\r\n  });\r\n\r\n  it('should validate payment details with Luhn algorithm for credit card, PayPal, and Invoice', () => {\r\n    // Invalid card number (fails Luhn algorithm)\r\n    const invalidPayment: PaymentDetails = {\r\n      method: 'CREDIT_CARD',\r\n      cardNumber: '4000000000000001',\r\n      cardHolder: 'John Doe',\r\n      expiryDate: '12/28',\r\n      cvv: '123',\r\n    };\r\n    store.updatePaymentInfo(invalidPayment);\r\n    expect(store.isPaymentInfoValid()).toBe(false);\r\n\r\n    // Valid card number (passes Luhn algorithm: 4532015112830366)\r\n    const validPayment: PaymentDetails = {\r\n      method: 'CREDIT_CARD',\r\n      cardNumber: '4532015112830366',\r\n      cardHolder: 'John Doe',\r\n      expiryDate: '12/28',\r\n      cvv: '123',\r\n    };\r\n    store.updatePaymentInfo(validPayment);\r\n    expect(store.isPaymentInfoValid()).toBe(true);\r\n\r\n    // PayPal validation\r\n    store.updatePaymentInfo({ method: 'PAYPAL', paypalEmail: 'invalid' });\r\n    expect(store.isPaymentInfoValid()).toBe(false);\r\n\r\n    store.updatePaymentInfo({ method: 'PAYPAL', paypalEmail: 'user@example.com' });\r\n    expect(store.isPaymentInfoValid()).toBe(true);\r\n\r\n    // Invoice validation\r\n    store.updatePaymentInfo({ method: 'INVOICE' });\r\n    expect(store.isPaymentInfoValid()).toBe(true);\r\n  });\r\n\r\n  it('should prevent advancing step if current step is invalid and allow step navigation', () => {\r\n    expect(store.nextStep()).toBe(false);\r\n    expect(store.currentStep()).toBe(1);\r\n\r\n    store.updateCustomerInfo({\r\n      firstName: 'Jane',\r\n      lastName: 'Smith',\r\n      email: 'jane@example.com',\r\n      phone: '555-1234567',\r\n    });\r\n    expect(store.isCustomerInfoValid()).toBe(true);\r\n\r\n    expect(store.nextStep()).toBe(true);\r\n    expect(store.currentStep()).toBe(2);\r\n\r\n    // Test prevStep\r\n    store.prevStep();\r\n    expect(store.currentStep()).toBe(1);\r\n\r\n    store.prevStep(); // Should not go below step 1\r\n    expect(store.currentStep()).toBe(1);\r\n  });\r\n\r\n  it('should calculate grand total for order summary', () => {\r\n    const itemSubtotal = 200; // 2 * $100\r\n    const shippingCost = 14.99; // Express shipping\r\n    store.selectShippingMethod('express');\r\n\r\n    const grandTotal = store.calculateGrandTotal(itemSubtotal);\r\n    const expectedTax = +(itemSubtotal * 0.19).toFixed(2);\r\n    expect(grandTotal).toBe(+(itemSubtotal + expectedTax + shippingCost).toFixed(2));\r\n  });\r\n\r\n  it('should handle order submission failure when data is incomplete', () => {\r\n    const result = store.submitOrder(mockCartItems, 200);\r\n    expect(result.success).toBe(false);\r\n    expect(result.message).toBe('Invalid checkout information');\r\n    expect(store.orderStatus()).toBe('FAILED');\r\n  });\r\n\r\n  it('should submit order successfully and produce order confirmation', () => {\r\n    store.updateCustomerInfo({\r\n      firstName: 'John',\r\n      lastName: 'Doe',\r\n      email: 'john@example.com',\r\n      phone: '555-0101',\r\n    });\r\n    store.updateShippingAddress({\r\n      street: '456 Market St',\r\n      city: 'San Francisco',\r\n      state: 'CA',\r\n      zipCode: '94105',\r\n      country: 'USA',\r\n    });\r\n    store.updatePaymentInfo({\r\n      method: 'CREDIT_CARD',\r\n      cardNumber: '4532015112830366',\r\n      cardHolder: 'John Doe',\r\n      expiryDate: '12/28',\r\n      cvv: '123',\r\n    });\r\n\r\n    const result = store.submitOrder(mockCartItems, 200);\r\n    expect(result.success).toBe(true);\r\n    expect(store.orderStatus()).toBe('CONFIRMED');\r\n    expect(store.orderConfirmation()?.orderId).toBeDefined();\r\n    expect(store.orderConfirmation()?.items.length).toBe(1);\r\n  });\r\n});\r\n"},"packages/shop/checkout/src/lib/checkout-wizard/checkout-wizard.component.spec.ts":{"tests":[{"id":"26","name":"CheckoutWizardComponent should create checkout wizard component"}],"source":"import { ComponentFixture, TestBed } from '@angular/core/testing';\r\nimport { CheckoutWizardComponent } from './checkout-wizard.component';\r\nimport { CheckoutStore } from '../store/checkout.store';\r\n\r\ndescribe('CheckoutWizardComponent', () => {\r\n  let component: CheckoutWizardComponent;\r\n  let fixture: ComponentFixture<"+"CheckoutWizardComponent>;\r\n\r\n  beforeEach(async () => {\r\n    await TestBed.configureTestingModule({\r\n      imports: [CheckoutWizardComponent],\r\n      providers: [CheckoutStore],\r\n    }).compileComponents();\r\n\r\n    fixture = TestBed.createComponent(CheckoutWizardComponent);\r\n    component = fixture.componentInstance;\r\n    fixture.detectChanges();\r\n  });\r\n\r\n  it('should create checkout wizard component', () => {\r\n    expect(component).toBeTruthy();\r\n  });\r\n});\r\n"},"packages/shop/data/src/lib/services/products.service.spec.ts":{"tests":[{"id":"27","name":"ProductsService should be created"},{"id":"28","name":"ProductsService getProducts should return products with default pagination"},{"id":"29","name":"ProductsService getProducts should apply filters when provided"},{"id":"30","name":"ProductsService getProducts should handle error response"},{"id":"31","name":"ProductsService getProducts should handle network error"},{"id":"32","name":"ProductsService getProductById should return a product by id"},{"id":"33","name":"ProductsService getProductById should return null on error"},{"id":"34","name":"ProductsService getCategories should return categories list"},{"id":"35","name":"ProductsService getCategories should return empty array on error"},{"id":"36","name":"ProductsService getPriceRange should return price range"},{"id":"37","name":"ProductsService getPriceRange should return default range on error"},{"id":"38","name":"ProductsService loading and error signals should set loading to true when fetching products"},{"id":"39","name":"ProductsService loading and error signals should set error message on failure"}],"source":"import { TestBed } from '@angular/core/testing';\nimport { provideHttpClient } from '@angular/common/http';\nimport { provideHttpClientTesting, HttpTestingController } from '@angular/common/http/testing';\nimport { ProductsService } from './products.service';\nimport { Product, ApiResponse, PaginatedResponse, ProductFilter } from '@org/models';\n\ndescribe('ProductsService', () => {\n  let service: ProductsService;\n  let httpMock: HttpTestingController;\n  const apiUrl = 'http://localhost:3333/api';\n\n  beforeEach(() => {\n    TestBed.configureTestingModule({\n      providers: [\n        provideHttpClient(),\n        provideHttpClientTesting(),\n        ProductsService\n      ],\n    });\n    service = TestBed.inject(ProductsService);\n    httpMock = TestBed.inject(HttpTestingController);\n  });\n\n  afterEach(() => {\n    httpMock.verify();\n  });\n\n  it('should be created', () => {\n    expect(service).toBeTruthy();\n  });\n\n  describe('getProducts', () => {\n    const mockProductsResponse: ApiResponse<"+"PaginatedResponse<"+"Product>> = {\n      success: true,\n      data: {\n        items: [\n          {\n            id: '1',\n            name: 'Product 1',\n            description: 'Description 1',\n            price: 100,\n            imageUrl: 'image1.jpg',\n            category: 'Electronics',\n            inStock: true,\n            rating: 4.5,\n            reviewCount: 10,\n          },\n          {\n            id: '2',\n            name: 'Product 2',\n            description: 'Description 2',\n            price: 200,\n            imageUrl: 'image2.jpg',\n            category: 'Clothing',\n            inStock: false,\n            rating: 3.5,\n            reviewCount: 5,\n          },\n        ],\n        total: 2,\n        page: 1,\n        pageSize: 12,\n        totalPages: 1,\n      },\n    };\n\n    it('should return products with default pagination', () => {\n      service.getProducts().subscribe((response) => {\n        expect(response.items.length).toBe(2);\n        expect(response.total).toBe(2);\n        expect(response.page).toBe(1);\n        expect(service.loading()).toBeFalsy();\n        expect(service.error()).toBeNull();\n      });\n\n      const req = httpMock.expectOne(`${apiUrl}/products?page=1&pageSize=12`);\n      expect(req.request.method).toBe('GET');\n      req.flush(mockProductsResponse);\n    });\n\n    it('should apply filters when provided', () => {\n      const filter: ProductFilter = {\n        category: 'Electronics',\n        minPrice: 50,\n        maxPrice: 150,\n        inStock: true,\n        searchTerm: 'test',\n      };\n\n      service.getProducts(filter, 2, 20).subscribe((response) => {\n        expect(response).toBeTruthy();\n      });\n\n      const req = httpMock.expectOne(\n        `${apiUrl}/products?page=2&pageSize=20&category=Electronics&minPrice=50&maxPrice=150&inStock=true&searchTerm=test`\n      );\n      expect(req.request.method).toBe('GET');\n      req.flush(mockProductsResponse);\n    });\n\n    it('should handle error response', () => {\n      const errorResponse: ApiResponse<"+"PaginatedResponse<"+"Product>> = {\n        success: false,\n        error: 'Server error',\n        data: undefined as unknown\n      };\n\n      // Silence console.error for this test\n      const consoleErrorSpy = vi.spyOn(console, 'error').mockImplementation(() => undefined);\n\n      service.getProducts().subscribe((response) => {\n        expect(response.items).toEqual([]);\n        expect(response.total).toBe(0);\n        expect(service.error()).toContain('Server error');\n      });\n\n      const req = httpMock.expectOne(`${apiUrl}/products?page=1&pageSize=12`);\n      req.flush(errorResponse);\n\n      consoleErrorSpy.mockRestore();\n    });\n\n    it('should handle network error', () => {\n      // Silence console.error for this test\n      const consoleErrorSpy = vi.spyOn(console, 'error').mockImplementation(() => undefined);\n\n      service.getProducts().subscribe((response) => {\n        expect(response.items).toEqual([]);\n        expect(response.total).toBe(0);\n        expect(service.error()).toBeTruthy();\n      });\n\n      const req = httpMock.expectOne(`${apiUrl}/products?page=1&pageSize=12`);\n      req.error(new ProgressEvent('Network error'));\n\n      consoleErrorSpy.mockRestore();\n    });\n  });\n\n  describe('getProductById', () => {\n    const mockProduct: Product = {\n      id: '1',\n      name: 'Product 1',\n      description: 'Description 1',\n      price: 100,\n      imageUrl: 'image1.jpg',\n      category: 'Electronics',\n      inStock: true,\n      rating: 4.5,\n      reviewCount: 10,\n    };\n\n    it('should return a product by id', () => {\n      const mockResponse: ApiResponse<"+"Product> = {\n        success: true,\n        data: mockProduct,\n      };\n\n      service.getProductById('1').subscribe((product) => {\n        expect(product).toEqual(mockProduct);\n        expect(service.loading()).toBeFalsy();\n        expect(service.error()).toBeNull();\n      });\n\n      const req = httpMock.expectOne(`${apiUrl}/products/1`);\n      expect(req.request.method).toBe('GET');\n      req.flush(mockResponse);\n    });\n\n    it('should return null on error', () => {\n      // Silence console.error for this test\n      const consoleErrorSpy = vi.spyOn(console, 'error').mockImplementation(() => undefined);\n\n      service.getProductById('1').subscribe((product) => {\n        expect(product).toBeNull();\n        expect(service.error()).toBeTruthy();\n      });\n\n      const req = httpMock.expectOne(`${apiUrl}/products/1`);\n      req.error(new ProgressEvent('Network error'));\n\n      consoleErrorSpy.mockRestore();\n    });\n  });\n\n  describe('getCategories', () => {\n    it('should return categories list', () => {\n      const mockCategories = ['Electronics', 'Clothing', 'Books'];\n      const mockResponse: ApiResponse<"+"string[]> = {\n        success: true,\n        data: mockCategories,\n      };\n\n      service.getCategories().subscribe((categories) => {\n        expect(categories).toEqual(mockCategories);\n      });\n\n      const req = httpMock.expectOne(`${apiUrl}/products-metadata/categories`);\n      expect(req.request.method).toBe('GET');\n      req.flush(mockResponse);\n    });\n\n    it('should return empty array on error', () => {\n      // Silence console.error for this test\n      const consoleErrorSpy = vi.spyOn(console, 'error').mockImplementation(() => undefined);\n\n      service.getCategories().subscribe((categories) => {\n        expect(categories).toEqual([]);\n      });\n\n      const req = httpMock.expectOne(`${apiUrl}/products-metadata/categories`);\n      req.error(new ProgressEvent('Network error'));\n\n      consoleErrorSpy.mockRestore();\n    });\n  });\n\n  describe('getPriceRange', () => {\n    it('should return price range', () => {\n      const mockPriceRange = { min: 10, max: 500 };\n      const mockResponse: ApiResponse<"+"{ min: number; max: number }> = {\n        success: true,\n        data: mockPriceRange,\n      };\n\n      service.getPriceRange().subscribe((range) => {\n        expect(range).toEqual(mockPriceRange);\n      });\n\n      const req = httpMock.expectOne(`${apiUrl}/products-metadata/price-range`);\n      expect(req.request.method).toBe('GET');\n      req.flush(mockResponse);\n    });\n\n    it('should return default range on error', () => {\n      // Silence console.error for this test\n      const consoleErrorSpy = vi.spyOn(console, 'error').mockImplementation(() => undefined);\n\n      service.getPriceRange().subscribe((range) => {\n        expect(range).toEqual({ min: 0, max: 1000 });\n      });\n\n      const req = httpMock.expectOne(`${apiUrl}/products-metadata/price-range`);\n      req.error(new ProgressEvent('Network error'));\n\n      consoleErrorSpy.mockRestore();\n    });\n  });\n\n  describe('loading and error signals', () => {\n    it('should set loading to true when fetching products', () => {\n      expect(service.loading()).toBeFalsy();\n\n      service.getProducts().subscribe();\n      expect(service.loading()).toBeTruthy();\n\n      const req = httpMock.expectOne(`${apiUrl}/products?page=1&pageSize=12`);\n      req.flush({ success: true, data: { items: [], total: 0, page: 1, pageSize: 12, totalPages: 0 } });\n\n      expect(service.loading()).toBeFalsy();\n    });\n\n    it('should set error message on failure', () => {\n      // Silence console.error for this test\n      const consoleErrorSpy = vi.spyOn(console, 'error').mockImplementation(() => undefined);\n      expect(service.error()).toBeNull();\n\n      service.getProductById('1').subscribe(() => {\n        expect(service.error()).toBeTruthy();\n      });\n\n      const req = httpMock.expectOne(`${apiUrl}/products/1`);\n      req.error(new ProgressEvent('Network error'));\n\n      consoleErrorSpy.mockRestore();\n    });\n  });\n});\n"},"packages/shop/feature-product-detail/src/lib/product-detail/product-detail.component.spec.ts":{"tests":[{"id":"40","name":"ProductDetailComponent should create"},{"id":"41","name":"ProductDetailComponent should load product on init"},{"id":"42","name":"ProductDetailComponent should handle error when product not found"},{"id":"43","name":"ProductDetailComponent should handle error when loading fails"},{"id":"44","name":"ProductDetailComponent should calculate star ratings correctly"},{"id":"45","name":"ProductDetailComponent should handle add to cart action"}],"source":"import { TestBed, ComponentFixture } from '@angular/core/testing';\nimport { ActivatedRoute, Router } from '@angular/router';\nimport { of, throwError } from 'rxjs';\nimport { ProductDetailComponent } from './product-detail.component';\nimport { ProductsService } from '@org/shop/data';\nimport { Product } from '@org/models';\nimport { describe, it, beforeEach, expect, vi } from 'vitest';\n\ndescribe('ProductDetailComponent', () => {\n  let component: ProductDetailComponent;\n  let fixture: ComponentFixture<"+"ProductDetailComponent>;\n  let mockProductsService: Partial<"+"ProductsService>;\n  let mockRouter: Partial<"+"Router>;\n  let mockActivatedRoute: Partial<"+"ActivatedRoute>;\n\n  const mockProduct: Product = {\n    id: '1',\n    name: 'Test Product',\n    description: 'Test Description',\n    price: 99.99,\n    imageUrl: 'https://example.com/image.jpg',\n    category: 'Electronics',\n    inStock: true,\n    rating: 4.5,\n    reviewCount: 100,\n  };\n\n  beforeEach(async () => {\n    mockProductsService = {\n      getProductById: vi.fn(),\n    };\n\n    mockRouter = {\n      navigate: vi.fn(),\n    };\n\n    mockActivatedRoute = {\n      snapshot: {\n        paramMap: {\n          get: vi.fn().mockReturnValue('1'),\n        },\n      },\n    };\n\n    await TestBed.configureTestingModule({\n      imports: [ProductDetailComponent],\n      providers: [\n        { provide: ProductsService, useValue: mockProductsService },\n        { provide: Router, useValue: mockRouter },\n        { provide: ActivatedRoute, useValue: mockActivatedRoute },\n      ],\n    }).compileComponents();\n\n    fixture = TestBed.createComponent(ProductDetailComponent);\n    component = fixture.componentInstance;\n  });\n\n  it('should create', () => {\n    expect(component).toBeTruthy();\n  });\n\n  it('should load product on init', () => {\n    mockProductsService.getProductById.mockReturnValue(of(mockProduct));\n\n    component.ngOnInit();\n\n    expect(mockProductsService.getProductById).toHaveBeenCalledWith('1');\n    expect(component.product()).toEqual(mockProduct);\n    expect(component.loading()).toBe(false);\n    expect(component.error()).toBe(null);\n  });\n\n  it('should handle error when product not found', () => {\n    mockProductsService.getProductById.mockReturnValue(of(null));\n\n    component.ngOnInit();\n\n    expect(component.error()).toBe('Product not found');\n    expect(component.loading()).toBe(false);\n  });\n\n  it('should handle error when loading fails', () => {\n    const consoleSpy = vi.spyOn(console, 'error').mockImplementation(() => undefined);\n    mockProductsService.getProductById.mockReturnValue(\n      throwError(() => new Error('Network error'))\n    );\n\n    component.ngOnInit();\n\n    expect(component.error()).toBe('Failed to load product details');\n    expect(component.loading()).toBe(false);\n    consoleSpy.mockRestore();\n  });\n\n  it('should calculate star ratings correctly', () => {\n    component.product.set(mockProduct);\n\n    const stars = component.getStars();\n\n    expect(stars).toEqual([true, true, true, true, true]);\n  });\n\n  it('should handle add to cart action', () => {\n    const alertSpy = vi.spyOn(window, 'alert').mockImplementation(() => undefined);\n    const consoleSpy = vi.spyOn(console, 'log').mockImplementation(() => undefined);\n    component.product.set(mockProduct);\n\n    component.addToCart();\n\n    expect(consoleSpy).toHaveBeenCalledWith('Adding to cart:', '1');\n    expect(alertSpy).toHaveBeenCalledWith('Product added to cart!');\n  });\n});\n"},"packages/shop/feature-products/src/lib/product-list/product-list.component.spec.ts":{"tests":[{"id":"46","name":"ProductListComponent should create"},{"id":"47","name":"ProductListComponent should load products and categories on init"},{"id":"48","name":"ProductListComponent should navigate to product detail when product is selected"},{"id":"49","name":"ProductListComponent should apply filters when search term changes"},{"id":"50","name":"ProductListComponent should apply filters when category changes"}],"source":"import { TestBed, ComponentFixture } from '@angular/core/testing';\nimport { Router } from '@angular/router';\nimport { of } from 'rxjs';\nimport { ProductListComponent } from './product-list.component';\nimport { ProductsService } from '@org/shop/data';\nimport { Product } from '@org/models';\nimport { describe, it, beforeEach, expect, vi } from 'vitest';\n\ndescribe('ProductListComponent', () => {\n  let component: ProductListComponent;\n  let fixture: ComponentFixture<"+"ProductListComponent>;\n  let mockProductsService: Partial<"+"ProductsService>;\n  let mockRouter: Partial<"+"Router>;\n\n  const mockProducts: Product[] = [\n    {\n      id: '1',\n      name: 'Product 1',\n      description: 'Description 1',\n      price: 99.99,\n      imageUrl: 'https://example.com/1.jpg',\n      category: 'Electronics',\n      inStock: true,\n      rating: 4.5,\n      reviewCount: 100,\n    },\n    {\n      id: '2',\n      name: 'Product 2',\n      description: 'Description 2',\n      price: 149.99,\n      imageUrl: 'https://example.com/2.jpg',\n      category: 'Clothing',\n      inStock: false,\n      rating: 4.0,\n      reviewCount: 50,\n    },\n  ];\n\n  beforeEach(async () => {\n    mockProductsService = {\n      getProducts: vi.fn(),\n      getCategories: vi.fn(),\n      loading: vi.fn().mockReturnValue(false),\n      error: vi.fn().mockReturnValue(null),\n    };\n\n    mockRouter = {\n      navigate: vi.fn(),\n    };\n\n    await TestBed.configureTestingModule({\n      imports: [ProductListComponent],\n      providers: [\n        { provide: ProductsService, useValue: mockProductsService },\n        { provide: Router, useValue: mockRouter },\n      ],\n    }).compileComponents();\n\n    fixture = TestBed.createComponent(ProductListComponent);\n    component = fixture.componentInstance;\n  });\n\n  it('should create', () => {\n    expect(component).toBeTruthy();\n  });\n\n  it('should load products and categories on init', () => {\n    mockProductsService.getProducts.mockReturnValue(of({\n      items: mockProducts,\n      total: 2,\n      page: 1,\n      pageSize: 10,\n      totalPages: 1,\n    }));\n    mockProductsService.getCategories.mockReturnValue(of(['Electronics', 'Clothing']));\n\n    component.ngOnInit();\n\n    expect(mockProductsService.getProducts).toHaveBeenCalled();\n    expect(mockProductsService.getCategories).toHaveBeenCalled();\n    expect(component.products()).toEqual(mockProducts);\n  });\n\n  it('should navigate to product detail when product is selected', () => {\n    const product = mockProducts[0];\n\n    component.onProductSelect(product);\n\n    expect(mockRouter.navigate).toHaveBeenCalledWith(['/products', product.id]);\n  });\n\n  it('should apply filters when search term changes', () => {\n    mockProductsService.getProducts.mockReturnValue(of({\n      items: mockProducts,\n      total: 2,\n      page: 1,\n      pageSize: 10,\n      totalPages: 1,\n    }));\n\n    component.searchTerm = 'Product 1';\n    component.onSearchChange();\n\n    expect(mockProductsService.getProducts).toHaveBeenCalledWith(\n      expect.objectContaining({\n        searchTerm: 'Product 1',\n      }),\n      1,\n      12\n    );\n  });\n\n  it('should apply filters when category changes', () => {\n    mockProductsService.getProducts.mockReturnValue(of({\n      items: [mockProducts[0]],\n      total: 1,\n      page: 1,\n      pageSize: 10,\n      totalPages: 1,\n    }));\n\n    component.selectedCategory = 'Electronics';\n    component.onFilterChange();\n\n    expect(mockProductsService.getProducts).toHaveBeenCalledWith(\n      expect.objectContaining({\n        category: 'Electronics',\n      }),\n      1,\n      12\n    );\n  });\n});"},"packages/shop/loyalty/src/lib/store/loyalty.store.spec.ts":{"tests":[{"id":"51","name":"LoyaltyStore should initialize with default BRONZE tier and 0 points balance"},{"id":"52","name":"LoyaltyStore should earn points for purchase using Bronze tier 1.0x multiplier"},{"id":"53","name":"LoyaltyStore should automatically upgrade to SILVER tier at 1000 lifetime points and apply 1.25x multiplier"},{"id":"54","name":"LoyaltyStore should upgrade through GOLD (3000 pts) and PLATINUM (7000 pts) tiers with exact boundaries"},{"id":"55","name":"LoyaltyStore should list redeemable vouchers user has enough balance to redeem"},{"id":"56","name":"LoyaltyStore should redeem voucher, deduct points, record REDEEMED transaction, and return coupon voucher"},{"id":"57","name":"LoyaltyStore should return error when attempting to redeem invalid voucherId"},{"id":"58","name":"LoyaltyStore should fail voucher redemption if points balance is insufficient"},{"id":"59","name":"LoyaltyStore should mark voucher as used when markVoucherAsUsed is called"}],"source":"import { TestBed } from '@angular/core/testing';\r\nimport { LoyaltyStore } from './loyalty.store';\r\n\r\ndescribe('LoyaltyStore', () => {\r\n  let store: InstanceType<"+"typeof LoyaltyStore>;\r\n\r\n  beforeEach(() => {\r\n    TestBed.configureTestingModule({\r\n      providers: [LoyaltyStore],\r\n    });\r\n    store = TestBed.inject(LoyaltyStore);\r\n  });\r\n\r\n  it('should initialize with default BRONZE tier and 0 points balance', () => {\r\n    expect(store.pointsBalance()).toBe(0);\r\n    expect(store.lifetimePoints()).toBe(0);\r\n    expect(store.currentTier()).toBe('BRONZE');\r\n    expect(store.tierMultiplier()).toBe(1.0);\r\n    expect(store.pointsToNextTier()).toBe(1000);\r\n    expect(store.tierProgressPercentage()).toBe(0);\r\n    expect(store.transactions()).toEqual([]);\r\n  });\r\n\r\n  it('should earn points for purchase using Bronze tier 1.0x multiplier', () => {\r\n    store.earnPointsForPurchase(150); // $150 -> 150 points\r\n    expect(store.pointsBalance()).toBe(150);\r\n    expect(store.lifetimePoints()).toBe(150);\r\n    expect(store.transactions().length).toBe(1);\r\n    expect(store.transactions()[0].type).toBe('EARNED');\r\n  });\r\n\r\n  it('should automatically upgrade to SILVER tier at 1000 lifetime points and apply 1.25x multiplier', () => {\r\n    store.addBonusPoints(1000, 'Welcome bonus');\r\n\r\n    expect(store.currentTier()).toBe('SILVER');\r\n    expect(store.tierMultiplier()).toBe(1.25);\r\n    expect(store.pointsToNextTier()).toBe(2000); // 3000 - 1000 = 2000 needed for Gold\r\n\r\n    // Next purchase at Silver tier: $200 * 1.25 multiplier = 250 points\r\n    store.earnPointsForPurchase(200);\r\n    expect(store.pointsBalance()).toBe(1250);\r\n    expect(store.lifetimePoints()).toBe(1250);\r\n  });\r\n\r\n  it('should upgrade through GOLD (3000 pts) and PLATINUM (7000 pts) tiers with exact boundaries', () => {\r\n    store.addBonusPoints(3000, 'Gold promo');\r\n    expect(store.currentTier()).toBe('GOLD');\r\n    expect(store.tierMultiplier()).toBe(1.5);\r\n    expect(store.pointsToNextTier()).toBe(4000); // 7000 - 3000\r\n\r\n    store.addBonusPoints(4000, 'Platinum promo'); // Total 7000 lifetime\r\n    expect(store.currentTier()).toBe('PLATINUM');\r\n    expect(store.tierMultiplier()).toBe(2.0);\r\n    expect(store.pointsToNextTier()).toBe(0);\r\n    expect(store.tierProgressPercentage()).toBe(100);\r\n  });\r\n\r\n  it('should list redeemable vouchers user has enough balance to redeem', () => {\r\n    store.addBonusPoints(600, 'Promo bonus');\r\n    // Available catalog has vouchers costing 300, 500, 1000 points\r\n    const redeemable = store.redeemableVouchers();\r\n    expect(redeemable.length).toBe(2); // 300 and 500 cost vouchers\r\n  });\r\n\r\n  it('should redeem voucher, deduct points, record REDEEMED transaction, and return coupon voucher', () => {\r\n    store.addBonusPoints(600, 'Promo bonus');\r\n\r\n    // Redeem $5 off voucher (costs 500 points)\r\n    const result = store.redeemVoucher('v-5usd');\r\n    expect(result.success).toBe(true);\r\n    expect(result.voucher?.code).toBeDefined();\r\n\r\n    expect(store.pointsBalance()).toBe(100); // 600 - 500\r\n    expect(store.lifetimePoints()).toBe(600); // lifetime stays unchanged!\r\n    expect(store.claimedVouchers().length).toBe(1);\r\n\r\n    const redeemTx = store.transactions().find((t) => t.type === 'REDEEMED');\r\n    expect(redeemTx?.points).toBe(500);\r\n  });\r\n\r\n  it('should return error when attempting to redeem invalid voucherId', () => {\r\n    store.addBonusPoints(1000, 'Big bonus');\r\n    const result = store.redeemVoucher('invalid-id');\r\n    expect(result.success).toBe(false);\r\n    expect(result.message).toBe('Voucher not found');\r\n    expect(store.pointsBalance()).toBe(1000);\r\n  });\r\n\r\n  it('should fail voucher redemption if points balance is insufficient', () => {\r\n    store.addBonusPoints(200, 'Small bonus');\r\n\r\n    // Attempt redeeming voucher costing 500 points\r\n    const result = store.redeemVoucher('v-5usd');\r\n    expect(result.success).toBe(false);\r\n    expect(result.message).toContain('Insufficient points');\r\n    expect(store.pointsBalance()).toBe(200);\r\n  });\r\n\r\n  it('should mark voucher as used when markVoucherAsUsed is called', () => {\r\n    store.addBonusPoints(600, 'Promo bonus');\r\n    const result = store.redeemVoucher('v-5usd');\r\n    const code = result.voucher?.code ?? '';\r\n\r\n    store.markVoucherAsUsed(code);\r\n    expect(store.claimedVouchers()[0].isRedeemed).toBe(true);\r\n  });\r\n});\r\n"},"packages/shop/loyalty/src/lib/loyalty-status/loyalty-status.component.spec.ts":{"tests":[{"id":"60","name":"LoyaltyStatusComponent should create loyalty status component"}],"source":"import { ComponentFixture, TestBed } from '@angular/core/testing';\r\nimport { LoyaltyStatusComponent } from './loyalty-status.component';\r\nimport { LoyaltyStore } from '../store/loyalty.store';\r\n\r\ndescribe('LoyaltyStatusComponent', () => {\r\n  let component: LoyaltyStatusComponent;\r\n  let fixture: ComponentFixture<"+"LoyaltyStatusComponent>;\r\n\r\n  beforeEach(async () => {\r\n    await TestBed.configureTestingModule({\r\n      imports: [LoyaltyStatusComponent],\r\n      providers: [LoyaltyStore],\r\n    }).compileComponents();\r\n\r\n    fixture = TestBed.createComponent(LoyaltyStatusComponent);\r\n    component = fixture.componentInstance;\r\n    fixture.detectChanges();\r\n  });\r\n\r\n  it('should create loyalty status component', () => {\r\n    expect(component).toBeTruthy();\r\n  });\r\n});\r\n"},"packages/api/products/src/lib/products.service.spec.ts":{"tests":[{"id":"61","name":"ProductsService should create"},{"id":"62","name":"ProductsService getAllProducts should return paginated products with default pagination"},{"id":"63","name":"ProductsService getAllProducts should filter products by category"},{"id":"64","name":"ProductsService getAllProducts should filter products by price range"},{"id":"65","name":"ProductsService getAllProducts should handle search term filtering"},{"id":"66","name":"ProductsService getAllProducts should paginate results correctly"},{"id":"67","name":"ProductsService getProductById should return a product by id"},{"id":"68","name":"ProductsService getProductById should return null for non-existent id"},{"id":"69","name":"ProductsService getCategories should return unique categories"},{"id":"70","name":"ProductsService getPriceRange should return min and max prices"}],"source":"import { ProductsService } from './products.service';\nimport { ProductFilter } from '@org/models';\n\ndescribe('ProductsService', () => {\n  let service: ProductsService;\n\n  beforeEach(() => {\n    service = new ProductsService();\n  });\n\n  it('should create', () => {\n    expect(service).toBeTruthy();\n  });\n\n  describe('getAllProducts', () => {\n    it('should return paginated products with default pagination', () => {\n      const result = service.getAllProducts();\n\n      expect(result).toHaveProperty('items');\n      expect(result).toHaveProperty('total');\n      expect(result).toHaveProperty('page');\n      expect(result).toHaveProperty('pageSize');\n      expect(result.page).toBe(1);\n      expect(result.pageSize).toBe(12);\n      expect(result.items.length).toBeLessThanOrEqual(12);\n    });\n\n    it('should filter products by category', () => {\n      const filter: ProductFilter = { category: 'Electronics' };\n      const result = service.getAllProducts(filter);\n\n      result.items.forEach((product) => {\n        expect(product.category).toBe('Electronics');\n      });\n    });\n\n    it('should filter products by price range', () => {\n      const filter: ProductFilter = { minPrice: 50, maxPrice: 150 };\n      const result = service.getAllProducts(filter);\n\n      result.items.forEach((product) => {\n        expect(product.price).toBeGreaterThanOrEqual(50);\n        expect(product.price).toBeLessThanOrEqual(150);\n      });\n    });\n\n    it('should handle search term filtering', () => {\n      const filter: ProductFilter = { searchTerm: 'Product 1' };\n      const result = service.getAllProducts(filter);\n\n      result.items.forEach((product) => {\n        const matchesSearch =\n          product.name.toLowerCase().includes('product 1') ||\n          product.description.toLowerCase().includes('product 1');\n        expect(matchesSearch).toBe(true);\n      });\n    });\n\n    it('should paginate results correctly', () => {\n      const page1 = service.getAllProducts(undefined, 1, 5);\n      const page2 = service.getAllProducts(undefined, 2, 5);\n\n      expect(page1.items.length).toBeLessThanOrEqual(5);\n      expect(page2.items.length).toBeLessThanOrEqual(5);\n      expect(page1.items[0]?.id).not.toBe(page2.items[0]?.id);\n    });\n  });\n\n  describe('getProductById', () => {\n    it('should return a product by id', () => {\n      const product = service.getProductById('prod-1');\n\n      expect(product).toBeTruthy();\n      expect(product?.id).toBe('prod-1');\n    });\n\n    it('should return null for non-existent id', () => {\n      const product = service.getProductById('non-existent');\n\n      expect(product).toBeNull();\n    });\n  });\n\n  describe('getCategories', () => {\n    it('should return unique categories', () => {\n      const categories = service.getCategories();\n\n      expect(categories).toBeTruthy();\n      expect(Array.isArray(categories)).toBe(true);\n      expect(categories.length).toBeGreaterThan(0);\n\n      const uniqueCategories = new Set(categories);\n      expect(uniqueCategories.size).toBe(categories.length);\n    });\n  });\n\n  describe('getPriceRange', () => {\n    it('should return min and max prices', () => {\n      const range = service.getPriceRange();\n\n      expect(range).toHaveProperty('min');\n      expect(range).toHaveProperty('max');\n      expect(range.min).toBeLessThanOrEqual(range.max);\n      expect(range.min).toBeGreaterThanOrEqual(0);\n    });\n  });\n});"},"packages/shop/search-filter/src/lib/store/search-filter.store.spec.ts":{"tests":[{"id":"71","name":"SearchFilterStore should initialize with all products"},{"id":"72","name":"SearchFilterStore should filter products by search term matching name"},{"id":"73","name":"SearchFilterStore should filter products by search term matching description when name does not match"},{"id":"74","name":"SearchFilterStore should filter products by category toggle (selection and unselection)"},{"id":"75","name":"SearchFilterStore should filter products by exact price boundaries"},{"id":"76","name":"SearchFilterStore should filter products by minimum rating"},{"id":"77","name":"SearchFilterStore should filter in-stock products only"},{"id":"78","name":"SearchFilterStore should count active filters correctly for multiple combined filters"},{"id":"79","name":"SearchFilterStore should sort products by price ascending and descending"},{"id":"80","name":"SearchFilterStore should sort products by rating descending"},{"id":"81","name":"SearchFilterStore should compute product facets correctly including empty state"},{"id":"82","name":"SearchFilterStore should paginate results properly"},{"id":"83","name":"SearchFilterStore should reset all filters"}],"source":"import { TestBed } from '@angular/core/testing';\r\nimport { SearchFilterStore } from './search-filter.store';\r\nimport { Product } from '@org/models';\r\n\r\ndescribe('SearchFilterStore', () => {\r\n  let store: InstanceType<"+"typeof SearchFilterStore>;\r\n\r\n  const mockProducts: Product[] = [\r\n    {\r\n      id: 'p1',\r\n      name: 'Wireless Ergonomic Mouse',\r\n      description: 'Comfortable wireless mouse for long work hours',\r\n      price: 49.99,\r\n      category: 'Peripherals',\r\n      imageUrl: 'https://example.com/mouse.jpg',\r\n      inStock: true,\r\n      rating: 4.8,\r\n      reviewCount: 200,\r\n    },\r\n    {\r\n      id: 'p2',\r\n      name: 'Mechanical Gaming Keyboard',\r\n      description: 'Tactile switches with RGB backlight',\r\n      price: 129.99,\r\n      category: 'Peripherals',\r\n      imageUrl: 'https://example.com/kbd.jpg',\r\n      inStock: false,\r\n      rating: 4.6,\r\n      reviewCount: 150,\r\n    },\r\n    {\r\n      id: 'p3',\r\n      name: '4K Ultra HD Monitor',\r\n      description: '32 inch IPS display panel',\r\n      price: 499.99,\r\n      category: 'Monitors',\r\n      imageUrl: 'https://example.com/mon.jpg',\r\n      inStock: true,\r\n      rating: 4.9,\r\n      reviewCount: 85,\r\n    },\r\n    {\r\n      id: 'p4',\r\n      name: 'USB-C Docking Station',\r\n      description: 'Multi-port hub for laptops',\r\n      price: 89.99,\r\n      category: 'Accessories',\r\n      imageUrl: 'https://example.com/hub.jpg',\r\n      inStock: true,\r\n      rating: 4.2,\r\n      reviewCount: 60,\r\n    },\r\n    {\r\n      id: 'p5',\r\n      name: 'Noise Cancelling Headphones',\r\n      description: 'Over-ear bluetooth audio',\r\n      price: 249.99,\r\n      category: 'Audio',\r\n      imageUrl: 'https://example.com/head.jpg',\r\n      inStock: true,\r\n      rating: 4.7,\r\n      reviewCount: 310,\r\n    },\r\n  ];\r\n\r\n  beforeEach(() => {\r\n    TestBed.configureTestingModule({\r\n      providers: [SearchFilterStore],\r\n    });\r\n    store = TestBed.inject(SearchFilterStore);\r\n    store.setProducts(mockProducts);\r\n  });\r\n\r\n  it('should initialize with all products', () => {\r\n    expect(store.allProducts().length).toBe(5);\r\n    expect(store.filteredProducts().length).toBe(5);\r\n    expect(store.activeFilterCount()).toBe(0);\r\n    expect(store.hasActiveFilters()).toBe(false);\r\n  });\r\n\r\n  it('should filter products by search term matching name', () => {\r\n    store.updateSearchTerm('Mouse');\r\n    expect(store.filteredProducts().length).toBe(1);\r\n    expect(store.filteredProducts()[0].id).toBe('p1');\r\n    expect(store.activeFilterCount()).toBe(1);\r\n    expect(store.hasActiveFilters()).toBe(true);\r\n  });\r\n\r\n  it('should filter products by search term matching description when name does not match', () => {\r\n    store.updateSearchTerm('laptops'); // Matches description of p4 (\"Multi-port hub for laptops\")\r\n    expect(store.filteredProducts().length).toBe(1);\r\n    expect(store.filteredProducts()[0].id).toBe('p4');\r\n  });\r\n\r\n  it('should filter products by category toggle (selection and unselection)', () => {\r\n    store.toggleCategory('Monitors');\r\n    expect(store.filteredProducts().length).toBe(1);\r\n    expect(store.filteredProducts()[0].id).toBe('p3');\r\n    expect(store.activeFilterCount()).toBe(1);\r\n\r\n    store.toggleCategory('Peripherals');\r\n    expect(store.filteredProducts().length).toBe(3); // Monitors + Peripherals\r\n\r\n    // Unselect Monitors\r\n    store.toggleCategory('Monitors');\r\n    expect(store.filteredProducts().length).toBe(2);\r\n    expect(store.filteredProducts().every((p) => p.category === 'Peripherals')).toBe(true);\r\n  });\r\n\r\n  it('should filter products by exact price boundaries', () => {\r\n    // Exact lower and upper bounds: 49.99 and 499.99\r\n    store.setPriceRange(49.99, 499.99);\r\n    expect(store.filteredProducts().length).toBe(5);\r\n    expect(store.activeFilterCount()).toBe(1);\r\n\r\n    // Narrow bounds: 50.00 to 130.00\r\n    store.setPriceRange(50.0, 130.0);\r\n    expect(store.filteredProducts().length).toBe(2); // p2 ($129.99), p4 ($89.99)\r\n  });\r\n\r\n  it('should filter products by minimum rating', () => {\r\n    store.setMinRating(4.7);\r\n    expect(store.filteredProducts().length).toBe(3); // p1 (4.8), p3 (4.9), p5 (4.7)\r\n    expect(store.activeFilterCount()).toBe(1);\r\n\r\n    store.setMinRating(0);\r\n    expect(store.activeFilterCount()).toBe(0);\r\n  });\r\n\r\n  it('should filter in-stock products only', () => {\r\n    store.toggleInStockOnly();\r\n    expect(store.filteredProducts().length).toBe(4); // excludes p2 which is out of stock\r\n    expect(store.activeFilterCount()).toBe(1);\r\n\r\n    store.toggleInStockOnly(); // Toggle off\r\n    expect(store.filteredProducts().length).toBe(5);\r\n    expect(store.activeFilterCount()).toBe(0);\r\n  });\r\n\r\n  it('should count active filters correctly for multiple combined filters', () => {\r\n    expect(store.activeFilterCount()).toBe(0);\r\n\r\n    store.updateSearchTerm('phone');\r\n    expect(store.activeFilterCount()).toBe(1);\r\n\r\n    store.toggleCategory('Audio');\r\n    expect(store.activeFilterCount()).toBe(2);\r\n\r\n    store.setPriceRange(10, 100);\r\n    expect(store.activeFilterCount()).toBe(3);\r\n\r\n    store.setMinRating(4.0);\r\n    expect(store.activeFilterCount()).toBe(4);\r\n\r\n    store.toggleInStockOnly();\r\n    expect(store.activeFilterCount()).toBe(5);\r\n  });\r\n\r\n  it('should sort products by price ascending and descending', () => {\r\n    store.setSortOption('price_asc');\r\n    const ascPrices = store.sortedProducts().map((p) => p.price);\r\n    expect(ascPrices).toEqual([49.99, 89.99, 129.99, 249.99, 499.99]);\r\n\r\n    store.setSortOption('price_desc');\r\n    const descPrices = store.sortedProducts().map((p) => p.price);\r\n    expect(descPrices).toEqual([499.99, 249.99, 129.99, 89.99, 49.99]);\r\n  });\r\n\r\n  it('should sort products by rating descending', () => {\r\n    store.setSortOption('rating_desc');\r\n    const ratings = store.sortedProducts().map((p) => p.rating);\r\n    expect(ratings).toEqual([4.9, 4.8, 4.7, 4.6, 4.2]);\r\n  });\r\n\r\n  it('should compute product facets correctly including empty state', () => {\r\n    store.setProducts([]);\r\n    const emptyFacets = store.facets();\r\n    expect(emptyFacets.priceRange).toEqual({ min: 0, max: 0 });\r\n    expect(emptyFacets.stockCount).toEqual({ inStock: 0, outOfStock: 0 });\r\n\r\n    store.setProducts(mockProducts);\r\n    const facets = store.facets();\r\n    expect(facets.categoryCounts['Peripherals']).toBe(2);\r\n    expect(facets.categoryCounts['Monitors']).toBe(1);\r\n    expect(facets.stockCount.inStock).toBe(4);\r\n    expect(facets.stockCount.outOfStock).toBe(1);\r\n    expect(facets.priceRange.min).toBe(49.99);\r\n    expect(facets.priceRange.max).toBe(499.99);\r\n    expect(facets.ratingCounts[4]).toBe(5);\r\n  });\r\n\r\n  it('should paginate results properly', () => {\r\n    store.setPageSize(2);\r\n    expect(store.totalPages()).toBe(3);\r\n\r\n    store.setPage(1);\r\n    expect(store.paginatedProducts().length).toBe(2);\r\n    expect(store.paginatedProducts()[0].id).toBe('p3');\r\n\r\n    store.setPage(2);\r\n    expect(store.paginatedProducts().length).toBe(2);\r\n    expect(store.paginatedProducts()[0].id).toBe('p5');\r\n  });\r\n\r\n  it('should reset all filters', () => {\r\n    store.updateSearchTerm('keyboard');\r\n    store.setMinRating(4.5);\r\n    store.toggleInStockOnly();\r\n    expect(store.hasActiveFilters()).toBe(true);\r\n\r\n    store.resetFilters();\r\n    expect(store.hasActiveFilters()).toBe(false);\r\n    expect(store.filteredProducts().length).toBe(5);\r\n  });\r\n});\r\n"},"packages/shop/search-filter/src/lib/search-filter-bar/search-filter-bar.component.spec.ts":{"tests":[{"id":"84","name":"SearchFilterBarComponent should create search filter bar component"},{"id":"85","name":"SearchFilterBarComponent should update search term when input value changes"}],"source":"import { ComponentFixture, TestBed } from '@angular/core/testing';\r\nimport { SearchFilterBarComponent } from './search-filter-bar.component';\r\nimport { SearchFilterStore } from '../store/search-filter.store';\r\n\r\ndescribe('SearchFilterBarComponent', () => {\r\n  let component: SearchFilterBarComponent;\r\n  let fixture: ComponentFixture<"+"SearchFilterBarComponent>;\r\n  let store: InstanceType<"+"typeof SearchFilterStore>;\r\n\r\n  beforeEach(async () => {\r\n    await TestBed.configureTestingModule({\r\n      imports: [SearchFilterBarComponent],\r\n      providers: [SearchFilterStore],\r\n    }).compileComponents();\r\n\r\n    fixture = TestBed.createComponent(SearchFilterBarComponent);\r\n    component = fixture.componentInstance;\r\n    store = TestBed.inject(SearchFilterStore);\r\n    fixture.detectChanges();\r\n  });\r\n\r\n  it('should create search filter bar component', () => {\r\n    expect(component).toBeTruthy();\r\n  });\r\n\r\n  it('should update search term when input value changes', () => {\r\n    const input = fixture.nativeElement.querySelector('input') as HTMLInputElement;\r\n    input.value = 'Headphones';\r\n    input.dispatchEvent(new Event('input'));\r\n    fixture.detectChanges();\r\n\r\n    expect(store.filterState().searchTerm).toBe('Headphones');\r\n  });\r\n});\r\n"},"packages/shop/shared-ui/src/lib/product-card/product-card.component.spec.ts":{"tests":[{"id":"86","name":"ProductCardComponent should create"},{"id":"87","name":"ProductCardComponent should display product information"},{"id":"88","name":"ProductCardComponent should emit productClick event when card is clicked"},{"id":"89","name":"ProductCardComponent should display out of stock overlay when product is not in stock"},{"id":"90","name":"ProductCardComponent should calculate star ratings correctly"},{"id":"91","name":"ProductCardComponent should handle product with low rating"}],"source":"import { TestBed, ComponentFixture } from '@angular/core/testing';\nimport { ProductCardComponent } from './product-card.component';\nimport { Product } from '@org/models';\nimport { describe, it, beforeEach, expect, vi } from 'vitest';\n\ndescribe('ProductCardComponent', () => {\n  let component: ProductCardComponent;\n  let fixture: ComponentFixture<"+"ProductCardComponent>;\n\n  const mockProduct: Product = {\n    id: '1',\n    name: 'Test Product',\n    description: 'Test Description',\n    price: 99.99,\n    imageUrl: 'https://example.com/image.jpg',\n    category: 'Electronics',\n    inStock: true,\n    rating: 4.5,\n    reviewCount: 100,\n  };\n\n  beforeEach(async () => {\n    await TestBed.configureTestingModule({\n      imports: [ProductCardComponent],\n    }).compileComponents();\n\n    fixture = TestBed.createComponent(ProductCardComponent);\n    component = fixture.componentInstance;\n    fixture.componentRef.setInput('product', mockProduct);\n  });\n\n  it('should create', () => {\n    expect(component).toBeTruthy();\n  });\n\n  it('should display product information', () => {\n    fixture.detectChanges();\n    const compiled = fixture.nativeElement;\n\n    expect(compiled.querySelector('.product-name').textContent).toContain('Test Product');\n    expect(compiled.querySelector('.product-category').textContent).toContain('Electronics');\n    expect(compiled.querySelector('.product-price').textContent).toContain('99.99');\n  });\n\n  it('should emit productClick event when card is clicked', () => {\n    const clickSpy = vi.fn();\n    component.productClick.subscribe(clickSpy);\n\n    fixture.nativeElement.querySelector('.product-card').click();\n\n    expect(clickSpy).toHaveBeenCalledWith(mockProduct);\n  });\n\n  it('should display out of stock overlay when product is not in stock', () => {\n    const outOfStockProduct = { ...mockProduct, inStock: false };\n    fixture.componentRef.setInput('product', outOfStockProduct);\n    fixture.detectChanges();\n\n    const compiled = fixture.nativeElement;\n    expect(compiled.querySelector('.out-of-stock-overlay')).toBeTruthy();\n    expect(compiled.querySelector('.product-card').classList).toContain('out-of-stock');\n  });\n\n  it('should calculate star ratings correctly', () => {\n    const stars = component.getStars();\n\n    expect(stars).toEqual([true, true, true, true, true]);\n  });\n\n  it('should handle product with low rating', () => {\n    const lowRatedProduct = { ...mockProduct, rating: 2.3 };\n    fixture.componentRef.setInput('product', lowRatedProduct);\n\n    const stars = component.getStars();\n\n    expect(stars).toEqual([true, true, false, false, false]);\n  });\n});"},"apps/shop/src/app/app.spec.ts":{"tests":[{"id":"92","name":"App should create the app component"},{"id":"93","name":"App should render title in header"},{"id":"94","name":"App should render navigation links"},{"id":"95","name":"App should render footer with correct copyright"},{"id":"96","name":"App should have router outlet for dynamic content"},{"id":"97","name":"App should apply change detection strategy OnPush"}],"source":"import { TestBed, ComponentFixture } from '@angular/core/testing';\nimport { App } from './app';\nimport { appRoutes } from './app.routes';\nimport { provideRouter } from '@angular/router';\nimport { By } from '@angular/platform-browser';\n\ndescribe('App', () => {\n  let component: App;\n  let fixture: ComponentFixture<"+"App>;\n\n  beforeEach(async () => {\n    await TestBed.configureTestingModule({\n      imports: [App],\n      providers: [provideRouter(appRoutes)],\n    }).compileComponents();\n\n    fixture = TestBed.createComponent(App);\n    component = fixture.componentInstance;\n    fixture.detectChanges();\n  });\n\n  it('should create the app component', () => {\n    expect(component).toBeTruthy();\n  });\n\n  it('should render title in header', () => {\n    const compiled = fixture.nativeElement as HTMLElement;\n    expect(compiled.querySelector('h1')?.textContent).toContain('Nx Shop Demo');\n  });\n\n  it('should render navigation links', () => {\n    const navLinks = fixture.debugElement.queryAll(By.css('nav a'));\n    expect(navLinks.length).toBeGreaterThan(0);\n    expect(navLinks[0].nativeElement.textContent).toContain('Products');\n    expect(navLinks[0].nativeElement.getAttribute('routerLink')).toBe(\n      '/products'\n    );\n  });\n\n  it('should render footer with correct copyright', () => {\n    const footer = fixture.nativeElement.querySelector('.app-footer');\n    expect(footer).toBeTruthy();\n    expect(footer?.textContent).toContain('© 2025 Nx Shop Demo');\n    expect(footer?.textContent).toContain(\n      'Frontend (Angular) + Backend (Express) + Shared Libraries'\n    );\n  });\n\n  it('should have router outlet for dynamic content', () => {\n    const routerOutlet = fixture.nativeElement.querySelector('router-outlet');\n    expect(routerOutlet).toBeTruthy();\n  });\n\n  it('should apply change detection strategy OnPush', () => {\n    const metadata = (App as unknown as { ɵcmp: { onPush: boolean } })['ɵcmp'];\n    expect(metadata.onPush).toBeTruthy();\n  });\n});\n"},"packages/shop/wishlist/src/lib/store/wishlist.store.spec.ts":{"tests":[{"id":"98","name":"WishlistCompareStore should initialize with empty wishlist and compare state"},{"id":"99","name":"WishlistCompareStore should toggle items in wishlist"},{"id":"100","name":"WishlistCompareStore should clear wishlist when clearWishlist() is called"},{"id":"101","name":"WishlistCompareStore should compute wishlist total price"},{"id":"102","name":"WishlistCompareStore should return empty stats matrix when compareList is empty"},{"id":"103","name":"WishlistCompareStore should add products to comparison list up to limit 4 and handle duplicates"},{"id":"104","name":"WishlistCompareStore should calculate comparison matrix statistics with strict price and rating tie-breakers"},{"id":"105","name":"WishlistCompareStore should handle equal prices and ratings in comparison matrix consistently"},{"id":"106","name":"WishlistCompareStore should remove items from comparison list and clear compare list"}],"source":"import { TestBed } from '@angular/core/testing';\r\nimport { WishlistCompareStore } from './wishlist.store';\r\nimport { Product } from '@org/models';\r\n\r\ndescribe('WishlistCompareStore', () => {\r\n  let store: InstanceType<"+"typeof WishlistCompareStore>;\r\n\r\n  const product1: Product = {\r\n    id: 'p1',\r\n    name: 'Smartphone Pro',\r\n    description: 'Flagship phone',\r\n    price: 999.0,\r\n    category: 'Electronics',\r\n    imageUrl: 'https://example.com/p1.jpg',\r\n    inStock: true,\r\n    rating: 4.9,\r\n    reviewCount: 300,\r\n  };\r\n\r\n  const product2: Product = {\r\n    id: 'p2',\r\n    name: 'Smartphone Mini',\r\n    description: 'Compact phone',\r\n    price: 699.0,\r\n    category: 'Electronics',\r\n    imageUrl: 'https://example.com/p2.jpg',\r\n    inStock: true,\r\n    rating: 4.6,\r\n    reviewCount: 120,\r\n  };\r\n\r\n  const product3: Product = {\r\n    id: 'p3',\r\n    name: 'Budget Phone',\r\n    description: 'Entry level phone',\r\n    price: 299.0,\r\n    category: 'Electronics',\r\n    imageUrl: 'https://example.com/p3.jpg',\r\n    inStock: false,\r\n    rating: 4.1,\r\n    reviewCount: 80,\r\n  };\r\n\r\n  const product4: Product = {\r\n    id: 'p4',\r\n    name: 'Tablet Max',\r\n    description: 'Large display',\r\n    price: 849.0,\r\n    category: 'Electronics',\r\n    imageUrl: 'https://example.com/p4.jpg',\r\n    inStock: true,\r\n    rating: 4.7,\r\n    reviewCount: 210,\r\n  };\r\n\r\n  const product5: Product = {\r\n    id: 'p5',\r\n    name: 'Smart Watch',\r\n    description: 'Fitness tracker',\r\n    price: 199.0,\r\n    category: 'Wearables',\r\n    imageUrl: 'https://example.com/p5.jpg',\r\n    inStock: true,\r\n    rating: 4.3,\r\n    reviewCount: 50,\r\n  };\r\n\r\n  beforeEach(() => {\r\n    TestBed.configureTestingModule({\r\n      providers: [WishlistCompareStore],\r\n    });\r\n    store = TestBed.inject(WishlistCompareStore);\r\n  });\r\n\r\n  it('should initialize with empty wishlist and compare state', () => {\r\n    expect(store.wishlist()).toEqual([]);\r\n    expect(store.compareList()).toEqual([]);\r\n    expect(store.wishlistCount()).toBe(0);\r\n    expect(store.compareCount()).toBe(0);\r\n    expect(store.canAddToCompare()).toBe(true);\r\n  });\r\n\r\n  it('should toggle items in wishlist', () => {\r\n    store.toggleWishlist(product1);\r\n    expect(store.wishlist().length).toBe(1);\r\n    expect(store.isWishlisted('p1')).toBe(true);\r\n\r\n    store.toggleWishlist(product1);\r\n    expect(store.wishlist().length).toBe(0);\r\n    expect(store.isWishlisted('p1')).toBe(false);\r\n  });\r\n\r\n  it('should clear wishlist when clearWishlist() is called', () => {\r\n    store.toggleWishlist(product1);\r\n    store.toggleWishlist(product2);\r\n    expect(store.wishlistCount()).toBe(2);\r\n\r\n    store.clearWishlist();\r\n    expect(store.wishlistCount()).toBe(0);\r\n    expect(store.wishlist()).toEqual([]);\r\n  });\r\n\r\n  it('should compute wishlist total price', () => {\r\n    store.toggleWishlist(product1); // 999\r\n    store.toggleWishlist(product2); // 699\r\n    expect(store.wishlistTotalValue()).toBe(1698);\r\n  });\r\n\r\n  it('should return empty stats matrix when compareList is empty', () => {\r\n    const emptyMatrix = store.comparisonMatrix();\r\n    expect(emptyMatrix.cheapestProduct).toBeNull();\r\n    expect(emptyMatrix.highestRatedProduct).toBeNull();\r\n    expect(emptyMatrix.inStockCount).toBe(0);\r\n    expect(emptyMatrix.categories).toEqual([]);\r\n  });\r\n\r\n  it('should add products to comparison list up to limit 4 and handle duplicates', () => {\r\n    expect(store.addToCompare(product1).success).toBe(true);\r\n    // Duplicate add should return success and not duplicate item\r\n    const duplicateAdd = store.addToCompare(product1);\r\n    expect(duplicateAdd.success).toBe(true);\r\n    expect(duplicateAdd.message).toBeUndefined();\r\n    expect(store.compareCount()).toBe(1);\r\n\r\n    expect(store.addToCompare(product2).success).toBe(true);\r\n    expect(store.addToCompare(product3).success).toBe(true);\r\n    expect(store.addToCompare(product4).success).toBe(true);\r\n\r\n    expect(store.compareCount()).toBe(4);\r\n    expect(store.canAddToCompare()).toBe(false);\r\n\r\n    // Attempt adding 5th product\r\n    const result = store.addToCompare(product5);\r\n    expect(result.success).toBe(false);\r\n    expect(result.message).toContain('Maximum 4 items');\r\n    expect(store.compareCount()).toBe(4);\r\n  });\r\n\r\n  it('should calculate comparison matrix statistics with strict price and rating tie-breakers', () => {\r\n    // Test with product1 (999, 4.9), product2 (699, 4.6), product3 (299, 4.1)\r\n    store.addToCompare(product1);\r\n    store.addToCompare(product2);\r\n    store.addToCompare(product3);\r\n\r\n    const matrix = store.comparisonMatrix();\r\n    expect(matrix.cheapestProduct?.id).toBe('p3');\r\n    expect(matrix.highestRatedProduct?.id).toBe('p1');\r\n    expect(matrix.inStockCount).toBe(2);\r\n    expect(matrix.categories).toEqual(['Electronics']);\r\n  });\r\n\r\n  it('should handle equal prices and ratings in comparison matrix consistently', () => {\r\n    const pEqual1: Product = { ...product1, id: 'pe1', price: 500, rating: 4.5 };\r\n    const pEqual2: Product = { ...product2, id: 'pe2', price: 500, rating: 4.5 };\r\n\r\n    store.addToCompare(pEqual1);\r\n    store.addToCompare(pEqual2);\r\n\r\n    const matrix = store.comparisonMatrix();\r\n    expect(matrix.cheapestProduct?.id).toBe('pe1');\r\n    expect(matrix.highestRatedProduct?.id).toBe('pe1');\r\n  });\r\n\r\n  it('should remove items from comparison list and clear compare list', () => {\r\n    store.addToCompare(product1);\r\n    store.addToCompare(product2);\r\n    expect(store.isCompared('p1')).toBe(true);\r\n\r\n    store.removeFromCompare('p1');\r\n    expect(store.isCompared('p1')).toBe(false);\r\n    expect(store.compareCount()).toBe(1);\r\n\r\n    store.clearCompare();\r\n    expect(store.compareCount()).toBe(0);\r\n  });\r\n});\r\n"},"packages/shop/wishlist/src/lib/wishlist-toggle/wishlist-toggle.component.spec.ts":{"tests":[{"id":"107","name":"WishlistToggleComponent should create wishlist toggle component"}],"source":"import { ComponentFixture, TestBed } from '@angular/core/testing';\r\nimport { WishlistToggleComponent } from './wishlist-toggle.component';\r\nimport { WishlistCompareStore } from '../store/wishlist.store';\r\n\r\ndescribe('WishlistToggleComponent', () => {\r\n  let component: WishlistToggleComponent;\r\n  let fixture: ComponentFixture<"+"WishlistToggleComponent>;\r\n\r\n  beforeEach(async () => {\r\n    await TestBed.configureTestingModule({\r\n      imports: [WishlistToggleComponent],\r\n      providers: [WishlistCompareStore],\r\n    }).compileComponents();\r\n\r\n    fixture = TestBed.createComponent(WishlistToggleComponent);\r\n    component = fixture.componentInstance;\r\n    fixture.detectChanges();\r\n  });\r\n\r\n  it('should create wishlist toggle component', () => {\r\n    expect(component).toBeTruthy();\r\n  });\r\n});\r\n"}},"projectRoot":"C:\\Users\\kluth\\Projects\\cloud.kluth.stryker-demo","config":{"$schema":"./node_modules/@stryker-mutator/core/schema/stryker-schema.json","_comment":"This config was generated using 'stryker init'. Please take a look at: https://stryker-mutator.io/docs/stryker-js/configuration/ for more information.","packageManager":"npm","reporters":["html","clear-text","progress"],"testRunner":"vitest","testRunner_comment":"Take a look at https://stryker-mutator.io/docs/stryker-js/vitest-runner for information about
