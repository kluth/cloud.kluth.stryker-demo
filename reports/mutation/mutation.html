l-Allow-Origin', '*');\n  res.header('Access-Control-Allow-Methods', 'GET, POST, PUT, DELETE, OPTIONS');\n  res.header('Access-Control-Allow-Headers', 'Origin, X-Requested-With, Content-Type, Accept');\n  if (req.method === 'OPTIONS') {\n    res.sendStatus(200);\n  } else {\n    next();\n  }\n});\n\napp.get('/', (req, res) => {\n  res.send({ message: 'Hello API' });\n});\n\n// Products endpoints\napp.get('/api/products', (req, res) => {\n  try {\n    const filter: ProductFilter = {};\n\n    if (req.query.category) {\n      filter.category = req.query.category as string;\n    }\n    if (req.query.minPrice) {\n      filter.minPrice = Number(req.query.minPrice);\n    }\n    if (req.query.maxPrice) {\n      filter.maxPrice = Number(req.query.maxPrice);\n    }\n    if (req.query.inStock !== undefined) {\n      filter.inStock = req.query.inStock === 'true';\n    }\n    if (req.query.searchTerm) {\n      filter.searchTerm = req.query.searchTerm as string;\n    }\n\n    const page = req.query.page ? Number(req.query.page) : 1;\n    const pageSize = req.query.pageSize ? Number(req.query.pageSize) : 12;\n\n    const result = productsService.getAllProducts(filter, page, pageSize);\n\n    const response: ApiResponse<"+"PaginatedResponse<"+"Product>> = {\n      data: result,\n      success: true,\n    };\n\n    res.json(response);\n  } catch (error) {\n    const response: ApiResponse<"+"null> = {\n      data: null,\n      success: false,\n      error: error instanceof Error ? error.message : 'Unknown error',\n    };\n    res.status(500).json(response);\n  }\n});\n\napp.get('/api/products/:id', (req, res) => {\n  try {\n    const product = productsService.getProductById(req.params.id);\n\n    if (!product) {\n      const response: ApiResponse<"+"null> = {\n        data: null,\n        success: false,\n        error: 'Product not found',\n      };\n      return res.status(404).json(response);\n    }\n\n    const response: ApiResponse<"+"Product> = {\n      data: product,\n      success: true,\n    };\n\n    res.json(response);\n  } catch (error) {\n    const response: ApiResponse<"+"null> = {\n      data: null,\n      success: false,\n      error: error instanceof Error ? error.message : 'Unknown error',\n    };\n    res.status(500).json(response);\n  }\n});\n\napp.get('/api/products-metadata/categories', (req, res) => {\n  try {\n    const categories = productsService.getCategories();\n    const response: ApiResponse<"+"string[]> = {\n      data: categories,\n      success: true,\n    };\n    res.json(response);\n  } catch (error) {\n    const response: ApiResponse<"+"null> = {\n      data: null,\n      success: false,\n      error: error instanceof Error ? error.message : 'Unknown error',\n    };\n    res.status(500).json(response);\n  }\n});\n\napp.get('/api/products-metadata/price-range', (req, res) => {\n  try {\n    const priceRange = productsService.getPriceRange();\n    const response: ApiResponse<"+"{ min: number; max: number }> = {\n      data: priceRange,\n      success: true,\n    };\n    res.json(response);\n  } catch (error) {\n    const response: ApiResponse<"+"null> = {\n      data: null,\n      success: false,\n      error: error instanceof Error ? error.message : 'Unknown error',\n    };\n    res.status(500).json(response);\n  }\n});\n\napp.listen(port, host, () => {\n  console.log(`[ ready ] http://${host}:${port}`);\n});\n"},"apps/api/vite.config.ts":{"language":"typescript","mutants":[{"id":"552","mutatorName":"ArrowFunction","replacement":"() => undefined","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":3,"line":22},"start":{"column":29,"line":5}}},{"id":"553","mutatorName":"ObjectLiteral","replacement":"{}","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":2,"line":22},"start":{"column":36,"line":5}}},{"id":"554","mutatorName":"StringLiteral","replacement":"\"\"","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":48,"line":7},"st sion","replacement":"Math.min(...prices)","status":"Survived","static":false,"testsCompleted":1,"coveredBy":["70"],"location":{"end":{"column":31,"line":96},"start":{"column":12,"line":96}}}],"source":"import { Product, ProductFilter, PaginatedResponse } from '@org/models';\n\nexport class ProductsService {\n  private products: Product[] = this.generateMockProducts();\n\n  private generateMockProducts(): Product[] {\n    const categories = ['Electronics', 'Clothing', 'Books', 'Home & Garden', 'Sports'];\n    const products: Product[] = [];\n\n    for (let i = 1; i <"+"= 50; i++) {\n      const category = categories[Math.floor(Math.random() * categories.length)];\n      products.push({\n        id: `prod-${i}`,\n        name: `Product ${i}`,\n        description: `This is a high-quality ${category.toLowerCase()} product with excellent features and great value for money.`,\n        price: Math.round(Math.random() * 500 * 100) / 100 + 10,\n        category,\n        imageUrl: `https://placehold.co/300x300?text=Product+${i}`,\n        inStock: Math.random() > 0.2,\n        rating: Math.round((Math.random() * 2 + 3) * 10) / 10,\n        reviewCount: Math.floor(Math.random() * 500),\n      });\n    }\n\n    return products;\n  }\n\n  getAllProducts(\n    filter?: ProductFilter,\n    page = 1,\n    pageSize = 12\n  ): PaginatedResponse<"+"Product> {\n    let filteredProducts = [...this.products];\n\n    if (filter) {\n      if (filter.category) {\n        filteredProducts = filteredProducts.filter(\n          p => p.category === filter.category\n        );\n      }\n\n      if (filter.minPrice !== undefined) {\n        const minPrice = filter.minPrice;\n        filteredProducts = filteredProducts.filter(p => p.price >= minPrice);\n      }\n\n      if (filter.maxPrice !== undefined) {\n        const maxPrice = filter.maxPrice;\n        filteredProducts = filteredProducts.filter(p => p.price <"+"= maxPrice);\n      }\n\n      if (filter.inStock !== undefined) {\n        filteredProducts = filteredProducts.filter(\n          p => p.inStock === filter.inStock\n        );\n      }\n\n      if (filter.searchTerm) {\n        const searchLower = filter.searchTerm.toLowerCase();\n        filteredProducts = filteredProducts.filter(\n          p =>\n            p.name.toLowerCase().includes(searchLower) ||\n            p.description.toLowerCase().includes(searchLower) ||\n            p.category.toLowerCase().includes(searchLower)\n        );\n      }\n    }\n\n    const total = filteredProducts.length;\n    const totalPages = Math.ceil(total / pageSize);\n    const startIndex = (page - 1) * pageSize;\n    const endIndex = startIndex + pageSize;\n    const items = filteredProducts.slice(startIndex, endIndex);\n\n    return {\n      items,\n      total,\n      page,\n      pageSize,\n      totalPages,\n    };\n  }\n\n  getProductById(id: string): Product | null {\n    return this.products.find(p => p.id === id) || null;\n  }\n\n  getCategories(): string[] {\n    return [...new Set(this.products.map(p => p.category))];\n  }\n\n  getPriceRange(): { min: number; max: number } {\n    const prices = this.products.map(p => p.price);\n    return {\n      min: Math.min(...prices),\n      max: Math.max(...prices),\n    };\n  }\n}"},"packages/api/products/vite.config.ts":{"language":"typescript","mutants":[{"id":"805","mutatorName":"ArrowFunction","replacement":"() => undefined","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":3,"line":22},"start":{"column":29,"line":5}}},{"id":"806","mutatorName":"ObjectLiteral","replacement":"{}","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":2,"line":22},"start":{"column":36,"line":5}}},{"id":"807","mutatorName":"StringLiteral","replacement":"\"\"","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":64,"line":7},"start":{"column":13,"line":7}}},{"id":"808","mutatorName":"ArrayDeclaration","replacement":"[]","status":"NoCoverage",  withMethods, patchState } from '@ngrx/signals';\r\nimport { CartItem, Coupon, SupportedCurrency, Product, ProductVariant } from '@org/models';\r\n\r\nexport interface CartState {\r\n  items: CartItem[];\r\n  couponCode: string | null;\r\n  appliedDiscount: Coupon | null;\r\n  targetCurrency: SupportedCurrency;\r\n}\r\n\r\nconst initialState: CartState = {\r\n  items: [],\r\n  couponCode: null,\r\n  appliedDiscount: null,\r\n  targetCurrency: 'USD',\r\n};\r\n\r\nconst VALID_COUPONS: Record<"+"string, Coupon> = {\r\n  SAVE10: { code: 'SAVE10', type: 'PERCENTAGE', value: 10 },\r\n  SAVE20: { code: 'SAVE20', type: 'FIXED', value: 20 },\r\n  FREESHIP: { code: 'FREESHIP', type: 'FREESHIP', value: 0 },\r\n};\r\n\r\nconst CURRENCY_RATES: Record<"+"SupportedCurrency, number> = {\r\n  USD: 1.0,\r\n  EUR: 0.92,\r\n  GBP: 0.79,\r\n};\r\n\r\nexport const CartStore = signalStore(\r\n  { providedIn: 'root' },\r\n  withState(initialState),\r\n  withComputed((store) => {\r\n    const rawSubtotal = () =>\r\n      store.items().reduce((acc, item) => {\r\n        const itemPrice =\r\n          item.product.price + (item.selectedVariant?.additionalPrice || 0);\r\n        return acc + itemPrice * item.quantity;\r\n      }, 0);\r\n\r\n    const discountAmount = () => {\r\n      const discount = store.appliedDiscount();\r\n      if (!discount) return 0;\r\n      const subtotal = rawSubtotal();\r\n      if (discount.type === 'PERCENTAGE') {\r\n        return +((subtotal * discount.value) / 100).toFixed(2);\r\n      }\r\n      if (discount.type === 'FIXED') {\r\n        return Math.min(subtotal, discount.value);\r\n      }\r\n      return 0;\r\n    };\r\n\r\n    const netSubtotal = () => Math.max(0, rawSubtotal() - discountAmount());\r\n\r\n    const isEligibleForFreeShipping = () => {\r\n      const discount = store.appliedDiscount();\r\n      if (discount?.type === 'FREESHIP') return true;\r\n      return netSubtotal() >= 100;\r\n    };\r\n\r\n    const freeShippingRemaining = () => {\r\n      if (isEligibleForFreeShipping()) return 0;\r\n      return +(100 - netSubtotal()).toFixed(2);\r\n    };\r\n\r\n    const shippingCost = () => {\r\n      if (store.items().length === 0) return 0;\r\n      return isEligibleForFreeShipping() ? 0 : 5.99;\r\n    };\r\n\r\n    const taxAmount = () => +((netSubtotal() * 0.19)).toFixed(2);\r\n\r\n    const total = () =>\r\n      +(netSubtotal() + taxAmount() + shippingCost()).toFixed(2);\r\n\r\n    const convertedTotal = () => {\r\n      const rate = CURRENCY_RATES[store.targetCurrency()] || 1.0;\r\n      return +(total() * rate).toFixed(2);\r\n    };\r\n\r\n    const itemCount = () =>\r\n      store.items().reduce((acc, item) => acc + item.quantity, 0);\r\n\r\n    const isEmpty = () => store.items().length === 0;\r\n\r\n    return {\r\n      rawSubtotal,\r\n      discountAmount,\r\n      netSubtotal,\r\n      isEligibleForFreeShipping,\r\n      freeShippingRemaining,\r\n      shippingCost,\r\n      taxAmount,\r\n      total,\r\n      convertedTotal,\r\n      itemCount,\r\n      isEmpty,\r\n    };\r\n  }),\r\n  withMethods((store) => ({\r\n    addItem(product: Product, quantity = 1, selectedVariant?: ProductVariant) {\r\n      const currentItems = store.items();\r\n      const existingIndex = currentItems.findIndex(\r\n        (item) =>\r\n          item.product.id === product.id &&\r\n          item.selectedVariant?.id === selectedVariant?.id\r\n      );\r\n\r\n      if (existingIndex > -1) {\r\n        const updated = [...currentItems];\r\n        updated[existingIndex] = {\r\n          ...updated[existingIndex],\r\n          quantity: updated[existingIndex].quantity + quantity,\r\n        };\r\n        patchState(store, { items: updated });\r\n      } else {\r\n        const newItem: CartItem = {\r\n          product,\r\n          quantity,\r\n          selectedVariant,\r\n          addedAt: new Date().toISOString(),\r\n        };\r\n        patchState(store, { items: [...currentItems, newItem] });\r\n      }\r\n    },\r\n\r\n    removeItem(productId: string, variantId?: string) {\r\n      const updated = store\r\n        .items()\r\n        .filter(\r\n          (item) =>\r\n            !(\r\n              item.product.id === productId &&\r\n              (!variantId || item.selectedVariant?.id === variantId)\r\n            )\r\n        );\r\n      patchState(store, { items: updated });\r\n    },\r\n\r\n    updateQuantity(productId: string, quantity: number, variantId?: string) {\r\n      if (quantity <"+"= 0) {\r\n        this.removeItem(productId, variantId);\r\n        return;\r\n      }\r\n      const updated = store.items().map((item) => {\r\n        if (\r\n          item.product.id === productId &&\r\n          (!variantId || item.selectedVariant?.id === variantId)\r\n        ) {\r\n          return { ...item, quantity };\r\n        }\r\n        return item;\r\n      });\r\n      patchState(store, { items: updated });\r\n    },\r\n\r\n    applyCoupon(code: string): { success: boolean; message: string } {\r\n      const coupon = VALID_COUPONS[code.toUpperCase()];\r\n      if (!coupon) {\r\n        return { success: false, message: 'Invalid coupon code' };\r\n      }\r\n      patchState(store, {\r\n        couponCode: coupon.code,\r\n        appliedDiscount: coupon,\r\n      });\r\n      return { success: true, message: 'Coupon applied successfully' };\r\n    },\r\n\r\n    removeCoupon() {\r\n      patchState(store, { couponCode: null, appliedDiscount: null });\r\n    },\r\n\r\n    setCurrency(currency: SupportedCurrency) {\r\n      patchState(store, { targetCurrency: currency });\r\n    },\r\n\r\n    clearCart() {\r\n      patchState(store, {\r\n        items: [],\r\n        couponCode: null,\r\n        appliedDiscount: null,\r\n      });\r\n    },\r\n  }))\r\n);\r\n"},"packages/shop/cart/vite.config.mts":{"language":"javascript","mutants":[{"id":"1014","mutatorName":"ArrowFunction","replacement":"() => undefined","status":"NoCoverage","static":false,"coveredBy":[],"lo  [],\r\n};\r\n\r\nconst VOUCHER_CATALOG: LoyaltyVoucher[] = [\r\n  {\r\n    id: 'v-3usd',\r\n    code: 'LOYAL3',\r\n    title: '$3 Off Voucher',\r\n    pointsCost: 300,\r\n    discountValue: 3,\r\n    discountType: 'FIXED',\r\n    minOrderAmount: 25,\r\n  },\r\n  {\r\n    id: 'v-5usd',\r\n    code: 'LOYAL5',\r\n    title: '$5 Off Voucher',\r\n    pointsCost: 500,\r\n    discountValue: 5,\r\n    discountType: 'FIXED',\r\n    minOrderAmount: 40,\r\n  },\r\n  {\r\n    id: 'v-10usd',\r\n    code: 'LOYAL10',\r\n    title: '$10 Off Voucher',\r\n    pointsCost: 1000,\r\n    discountValue: 10,\r\n    discountType: 'FIXED',\r\n    minOrderAmount: 75,\r\n  },\r\n  {\r\n    id: 'v-15pct',\r\n    code: 'VIP15',\r\n    title: '15% Off VIP Voucher',\r\n    pointsCost: 1500,\r\n    discountValue: 15,\r\n    discountType: 'PERCENTAGE',\r\n    minOrderAmount: 100,\r\n  },\r\n];\r\n\r\nexport const LoyaltyStore = signalStore(\r\n  { providedIn: 'root' },\r\n  withState(initialState),\r\n  withComputed((store) => {\r\n    const currentTier = (): LoyaltyTier => {\r\n      const pts = store.lifetimePoints();\r\n      if (pts >= 7000) return 'PLATINUM';\r\n      if (pts >= 3000) return 'GOLD';\r\n      if (pts >= 1000) return 'SILVER';\r\n      return 'BRONZE';\r\n    };\r\n\r\n    const tierMultiplier = () => {\r\n      const tier = currentTier();\r\n      switch (tier) {\r\n        case 'PLATINUM':\r\n          return 2.0;\r\n        case 'GOLD':\r\n          return 1.5;\r\n        case 'SILVER':\r\n          return 1.25;\r\n        case 'BRONZE':\r\n        default:\r\n          return 1.0;\r\n      }\r\n    };\r\n\r\n    const pointsToNextTier = () => {\r\n      const pts = store.lifetimePoints();\r\n      if (pts >= 7000) return 0;\r\n      if (pts >= 3000) return 7000 - pts;\r\n      if (pts >= 1000) return 3000 - pts;\r\n      return 1000 - pts;\r\n    };\r\n\r\n    const tierProgressPercentage = () => {\r\n      const pts = store.lifetimePoints();\r\n      if (pts >= 7000) return 100;\r\n      let prevThreshold = 0;\r\n      let nextThreshold = 1000;\r\n\r\n      if (pts >= 3000) {\r\n        prevThreshold = 3000;\r\n        nextThreshold = 7000;\r\n      } else if (pts >= 1000) {\r\n        prevThreshold = 1000;\r\n        nextThreshold = 3000;\r\n      }\r\n\r\n      const progress = ((pts - prevThreshold) / (nextThreshold - prevThreshold)) * 100;\r\n      return +Math.min(100, Math.max(0, progress)).toFixed(1);\r\n    };\r\n\r\n    const redeemableVouchers = () =>\r\n      VOUCHER_CATALOG.filter((v) => v.pointsCost <"+"= store.pointsBalance());\r\n\r\n    return {\r\n      currentTier,\r\n      tierMultiplier,\r\n      pointsToNextTier,\r\n      tierProgressPercentage,\r\n      redeemableVouchers,\r\n    };\r\n  }),\r\n  withMethods((store) => ({\r\n    earnPointsForPurchase(amountSpent: number) {\r\n      const multiplier = store.tierMultiplier();\r\n      const earned = Math.floor(amountSpent * multiplier);\r\n      const newTx: LoyaltyTransaction = {\r\n        id: `tx-${Date.now()}-${Math.floor(Math.random() * 1000)}`,\r\n        type: 'EARNED',\r\n        points: earned,\r\n        description: `Earned ${earned} points for $${amountSpent} purchase`,\r\n        date: new Date().toISOString(),\r\n      };\r\n\r\n      patchState(store, {\r\n        pointsBalance: store.pointsBalance() + earned,\r\n        lifetimePoints: store.lifetimePoints() + earned,\r\n        transactions: [newTx, ...store.transactions()],\r\n      });\r\n    },\r\n\r\n    addBonusPoints(points: number, reason: string) {\r\n      const newTx: LoyaltyTransaction = {\r\n        id: `tx-${Date.now()}-${Math.floor(Math.random() * 1000)}`,\r\n        type: 'BONUS',\r\n        points,\r\n        description: reason,\r\n        date: new Date().toISOString(),\r\n      };\r\n\r\n      patchState(store, {\r\n        pointsBalance: store.pointsBalance() + points,\r\n        lifetimePoints: store.lifetimePoints() + points,\r\n        transactions: [newTx, ...store.transactions()],\r\n      });\r\n    },\r\n\r\n    redeemVoucher(voucherId: string): { success: boolean; message?: string; voucher?: LoyaltyVoucher } {\r\n      const voucher = VOUCHER_CATALOG.find((v) => v.id === voucherId);\r\n      if (!voucher) {\r\n        return { success: false, message: 'Voucher not found' };\r\n      }\r\n      if (store.pointsBalance() <"+" voucher.pointsCost) {\r\n        return { success: false, message: 'Insufficient points balance' };\r\n      }\r\n\r\n      const uniqueCode = `${voucher.code}-${Math.floor(Math.random() * 10000)}`;\r\n      const claimed: LoyaltyVoucher = {\r\n        ...voucher,\r\n        code: uniqueCode,\r\n        isRedeemed: false,\r\n      };\r\n\r\n      const newTx: LoyaltyTransaction = {\r\n        id: `tx-${Date.now()}-${Math.floor(Math.random() * 1000)}`,\r\n        type: 'REDEEMED',\r\n        points: voucher.pointsCost,\r\n        description: `Redeemed ${voucher.title}`,\r\n        date: new Date().toISOString(),\r\n      };\r\n\r\n      patchState(store, {\r\n        pointsBalance: store.pointsBalance() - voucher.pointsCost,\r\n        claimedVouchers: [...store.claimedVouchers(), claimed],\r\n        transactions: [newTx, ...store.transactions()],\r\n      });\r\n\r\n      return { success: true, voucher: claimed };\r\n    },\r\n\r\n    markVoucherAsUsed(code: string) {\r\n      const updated = store.claimedVouchers().map((v) => {\r\n        if (v.code === code) {\r\n          return { ...v, isRedeemed: true };\r\n        }\r\n        return v;\r\n      });\r\n      patchState(store, { claimedVouchers: updated });\r\n    },\r\n  }))\r\n);\r\n"},"packages/shop/loyalty/vite.config.mts":{"language":"javascript","mutants":[{"id":"1746","mutatorName":"ArrowFunction","replacement":"() => undefined","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":3,"line":23},"start":{"column":29,"line":6}}},{"id":"1747","mutatorName":"ObjectLiteral","replacement":"{}","status":"NoCoverage","static":fal ((store) => {\r\n    const filteredProducts = () => {\r\n      const { searchTerm, categories, minPrice, maxPrice, minRating, inStockOnly } =\r\n        store.filterState();\r\n\r\n      return store.allProducts().filter((p) => {\r\n        if (searchTerm) {\r\n          const term = searchTerm.toLowerCase();\r\n          const matchName = p.name.toLowerCase().includes(term);\r\n          const matchDesc = p.description.toLowerCase().includes(term);\r\n          if (!matchName && !matchDesc) return false;\r\n        }\r\n\r\n        if (categories.length > 0 && !categories.includes(p.category)) {\r\n          return false;\r\n        }\r\n\r\n        if (p.price <"+" minPrice || p.price > maxPrice) {\r\n          return false;\r\n        }\r\n\r\n        if (p.rating <"+" minRating) {\r\n          return false;\r\n        }\r\n\r\n        if (inStockOnly && !p.inStock) {\r\n          return false;\r\n        }\r\n\r\n        return true;\r\n      });\r\n    };\r\n\r\n    const sortedProducts = () => {\r\n      const list = [...filteredProducts()];\r\n      const opt = store.sortOption();\r\n\r\n      switch (opt) {\r\n        case 'price_asc':\r\n          return list.sort((a, b) => a.price - b.price);\r\n        case 'price_desc':\r\n          return list.sort((a, b) => b.price - a.price);\r\n        case 'rating_desc':\r\n          return list.sort((a, b) => b.rating - a.rating);\r\n        case 'name_asc':\r\n        default:\r\n          return list.sort((a, b) => a.name.localeCompare(b.name));\r\n      }\r\n    };\r\n\r\n    const totalPages = () =>\r\n      Math.ceil(sortedProducts().length / store.pageSize()) || 1;\r\n\r\n    const paginatedProducts = () => {\r\n      const page = store.currentPage();\r\n      const size = store.pageSize();\r\n      const start = (page - 1) * size;\r\n      return sortedProducts().slice(start, start + size);\r\n    };\r\n\r\n    const facets = (): ProductFacets => {\r\n      const products = store.allProducts();\r\n      cons
