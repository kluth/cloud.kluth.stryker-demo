name: Stryker Mutation Testing

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stryker:
    name: Run Stryker Mutation Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Stryker Mutation Testing
        run: npx stryker run

      - name: Upload Stryker HTML Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stryker-mutation-report
          path: reports/mutation/
          retention-days: 30
