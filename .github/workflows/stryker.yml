name: Stryker Mutation Testing

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stryker:
    name: Run Stryker Mutation Testing
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      NX_DAEMON: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build workspace projects
        run: npx nx run-many -t build --skip-nx-cache

      - name: Clean reports directory
        run: rm -rf reports/

      - name: Run Stryker Mutation Testing
        run: npx stryker run

      - name: Generate Workflow Step Summary
        if: always()
        run: |
          echo "# 🧬 Stryker Mutation Testing Summary (Run #${{ github.run_number }})" > $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The HTML report artifact \`stryker-mutation-report-run-${{ github.run_number }}\` contains the fresh, single-run report." >> $GITHUB_STEP_SUMMARY

      - name: Upload Stryker HTML Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stryker-mutation-report-run-${{ github.run_number }}
          path: reports/mutation/
          if-no-files-found: ignore
          retention-days: 30
